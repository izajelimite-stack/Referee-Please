services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"          # Java Edition
      - "19132:19132/udp"      # Bedrock (solo si activas Geyser en .env)
    env_file: .env
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      ENABLE_RCON: "true"
      USE_AIKAR_FLAGS: "true"
    volumes:
      - ./data:/data

  backups:
    image: itzg/mc-backup:latest
    container_name: minecraft-backups
    restart: unless-stopped
    depends_on:
      - minecraft
    environment:
      RCON_HOST: minecraft
      BACKUP_INTERVAL: "6h"
      PRUNE_BACKUPS_DAYS: "7"
      INITIAL_DELAY: "5m"
    env_file: .env
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
