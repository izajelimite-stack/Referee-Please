  .tagline { font-family: var(--f-mono); font-size: 24px; line-height: 1.1; color: var(--muted); margin: 0 0 8px; }

  .report td.num, .report th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .res { font-weight: 700; }
  .res.correct { color: #2f7a3a; } .res.partial { color: #9a6a00; } .res.wrong { color: #b0271b; }
  .why { color: #4d473b; font-size: 14px; }
  .pay { max-width: 420px; }

  .rep-head { padding-right: 200px; }
  .stamp { position: absolute; top: 28px; right: 24px; transform: rotate(-9deg); font-family: var(--f-display); font-weight: 700; font-size: clamp(16px, 3vw, 26px); padding: 6px 12px; border: 4px solid currentColor; opacity: .85; text-align: center; line-height: 1.05; max-width: 45%; }

  .report .note { max-width: 62ch; margin: 0; }

  @media (prefers-reduced-motion: reduce) { .meter .fill { transition: none; } }
</style>

    }
    const l = keys[keys.length - 1];
    return { x: l[1], y: l[2] ?? 0 };
  }

  // Estadio nocturno pixelado detrás del menú
  function stadium() {
    const cv = $("#bg");
    if (!cv) return;
    const ctx = cv.getContext("2d"), w = 320, h = 180;
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const crowd = [];
    for (let y = 58; y < 104; y += 4) for (let x = 0; x < w; x += 3) crowd.push([x + rnd() * 2, y + rnd() * 2, rnd()]);
    const towers = [22, 108, 212, 298];
    const frame = n => {
      const g = ctx.createLinearGradient(0, 0, 0, 60);
      g.addColorStop(0, "#070a0f"); g.addColorStop(1, "#141d28");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      // haces de luz
      for (const x of towers) {
        ctx.fillStyle = "rgba(255,236,190,.05)";
        ctx.beginPath(); ctx.moveTo(x - 6, 20); ctx.lineTo(x + 6, 20); ctx.lineTo(x + 60, 150); ctx.lineTo(x - 60, 150); ctx.fill();
      }
      // grada
      ctx.fillStyle = "#101820"; ctx.fillRect(0, 54, w, 52);
      for (const [x, y, r] of crowd) {
        const flash = !RM && ((r * 997 + n * 0.37) % 1) < 0.004;
        ctx.fillStyle = flash ? "#ffffff" : r < 0.45 ? "#2c4a63" : r < 0.8 ? "#5a3a33" : "#39444f";
        ctx.fillRect(x, y, flash ? 2 : 1, flash ? 2 : 1);
      }
      // torres de focos
      for (const x of towers) {
        ctx.fillStyle = "#1c2630"; ctx.fillRect(x - 1, 20, 2, 36);
        ctx.fillStyle = "#fff4d6"; ctx.fillRect(x - 7, 14, 14, 6);
        ctx.fillStyle = "rgba(255,244,214,.18)"; ctx.fillRect(x - 10, 11, 20, 12);
      }
      // vallas publicitarias
      for (let x = 0; x < w; x += 32) { ctx.fillStyle = (x / 32) % 2 ? "#243b56" : "#8a6a24"; ctx.fillRect(x, 104, 32, 5); }
      // césped
      for (let i = 0; i < 16; i++) { ctx.fillStyle = i % 2 ? "#23502f" : "#275a35"; ctx.fillRect(i * 20, 109, 20, h - 109); }
      ctx.fillStyle = "rgba(223,232,216,.7)";
      ctx.fillRect(0, 140, w, 1); // línea de medio campo (en perspectiva)
      ctx.strokeStyle = "rgba(223,232,216,.7)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(160, 140.5, 44, 12, 0, 0, 7); ctx.stroke();
      // el árbitro, solo en el círculo central
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(157, 147, 8, 2);
      ctx.fillStyle = "#0b0b0b"; ctx.fillRect(158, 136, 5, 7);
      ctx.fillStyle = "#1a1a1a"; ctx.fillRect(158, 143, 2, 5); ctx.fillRect(161, 143, 2, 5);
      ctx.fillStyle = "#e3c9a8"; ctx.fillRect(159, 132, 3, 4);
      ctx.fillStyle = "#f0b43c"; ctx.fillRect(163, 138, 1, 1); // silbato
    };
    let n = 0, last = 0;
    const loop = now => {
      if (now - last > 120) { frame(n++); last = now; }
      view.bg = requestAnimationFrame(loop);
    };
    frame(0);
    if (!RM) view.bg = requestAnimationFrame(loop);
  }

      view.t = clamp((now - t0) / LIVE_MS, 0, 1);
      draw();
      if (view.t < 1) view.anim = requestAnimationFrame(step);
      else finishLive();
    };
    view.anim = requestAnimationFrame(step);
  }

  function finishLive() {
    const inc = INCIDENTS[state.idx];
    state.cur.watched = true;
    const msgs = [...inc.post, inc.varHint];
    let i = 0;
    const next = () => {
      if (i >= msgs.length) return;
      say(...msgs[i++]);
      if (i < msgs.length) setTimeout(next, RM ? 0 : 700);
    };
    next();
    renderDecide();
  }

  function openVar() {
    if (state.varLeft <= 0) return;
    state.varLeft--;
    state.extra += 2;
    state.pressure = clamp(state.pressure + 8, 0, 100);
    state.cur.varOpen = true;
    view.t = 0;
    say("TÚ", "Me voy a la pantalla. Revisión VAR.");
    say("GRADA", "Uuuuuh... (la grada se impacienta)");
    renderHud();
    $("#monitor").classList.add("var");
    $("#tag").textContent = "VAR · REVISIÓN";
    $("#varbar").hidden = false;
    renderDecide();
    draw();
  }

  function wireVar() {
    const scrub = $("#scrub");
    if (!scrub) return;
    const set = t => { stopSlow(); view.t = clamp(t, 0, 1); draw(); };
    scrub.oninput = () => set(scrub.value / 1000);
    $("#fb").onclick = () => set(view.t - 0.01);
    $("#ff").onclick = () => set(view.t + 0.01);
    document.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => set(+b.dataset.jump));
    const toggle = (id, key) => { const b = $(id); b.onclick = () => { view[key] = !view[key]; draw(); }; };
    toggle("#zoom", "zoom");
    toggle("#line", "line");
    document.querySelectorAll("[data-cam]").forEach(b => b.onclick = () => { view.cam = b.dataset.cam; draw(); });
    $("#slow").onclick = () => {
      if (view.slowing) { stopSlow(); return; }
      if (view.t >= 1) view.t = 0;
      view.slowing = true;
      $("#slow").setAttribute("aria-pressed", "true");
      let last = performance.now();
      const step = now => {
        view.t = clamp(view.t + (now - last) / (LIVE_MS * 4), 0, 1);
        last = now;
        draw();
        if (view.t < 1 && view.slowing) view.anim = requestAnimationFrame(step);
        else stopSlow();
      };
      view.anim = requestAnimationFrame(step);
    };
  }
  function stopSlow() {
    view.slowing = false;
    cancelAnimationFrame(view.anim);
    const b = $("#slow");
    if (b) b.setAttribute("aria-pressed", "false");
  }

  function decide(i) {
    const inc = INCIDENTS[state.idx], o = inc.options[i];
    stopSlow();
    state.cur.decided = i;
    state.decisions[state.idx] = i;
    state.pressure = clamp(state.pressure + o.pressure, 0, 100);
    state.rep = clamp(state.rep + (o.grade === "correct" ? 10 : o.grade === "partial" ? 3 : -10), 0, 100);
    if (o.goal) state.score[o.goal]++;
    say("TÚ", o.label + ".");
    say("GRADA", o.crowd);
    if (state.pressure >= 80) say("GRADA", "El ambiente es irrespirable. El delegado pide calma por megafonía.");
    renderHud();
    renderDecide();
  }

  function nextStep() {
    if (state.idx === HALF_AFTER && state.screen === "incident") { state.screen = "half"; render(); return; }
    state.extra = 0;
    if (state.idx >= INCIDENTS.length - 1) { state.screen = "report"; render(); return; }
    state.idx++;
    state.screen = "incident";
    startIncident();
  }

  // ---------- Descanso ----------
  function renderHalf() {
    save();
    const b = state.bribe;
    screen.innerHTML = `
      <section class="sheet">
        <p class="eyebrow">Descanso · Vestuario arbitral</p>
        <h2 class="title" style="font-size:clamp(26px,5vw,44px)">Un sobre en la taquilla</h2>
        <p class="lead">Encima de tu ropa hay un sobre que antes no estaba. Dentro hay <b>3 millones de forintos</b> en billetes y una nota:</p>
        <p class="lead" style="font-family:var(--f-mono);font-size:24px;color:var(--amber)">«Por un buen arbitraje en la segunda parte. Tus amigos de Kőhegy.»</p>
        ${b === null ? `
          <div class="row">

          <button class="btn primary" id="cont">Salir a la segunda parte →</button>`}

  }

  // ---------- Informe ----------
  function renderReport() {
    const PAY = { correct: 40000, partial: 10000, wrong: -50000 };
    const ft = v => Math.abs(v).toLocaleString("es-ES", { useGrouping: true }).replace(/,/g, ".") + " Ft";
    const rows = INCIDENTS.map((inc, i) => {
      const o = inc.options[state.decisions[i]];
      return { inc, o, grade: o.grade };
    });
    const count = g => rows.filter(r => r.grade === g).length;
    const nC = count("correct"), nP = count("partial"), nW = count("wrong");
    const kept = state.bribe === "keep";
    const favoredDozsa = rows[3].grade !== "correct";
    const fine = state.pressure >= 70 ? -30000 : 0;
    const lines = [
      ["Honorarios de la final", 180000],
      [`Bonificación por aciertos (${nC} × ${ft(PAY.correct)})`, nC * PAY.correct],
      ...(nP ? [[`Decisiones aceptables (${nP} × ${ft(PAY.partial)})`, nP * PAY.partial]] : []),
      ...(nW ? [[`Multas por errores (${nW} × ${ft(PAY.wrong)})`, nW * PAY.wrong]] : []),
      ...(fine ? [["Sanción por incidentes en la grada", fine]] : []),
      ...(kept ? [["Sobre sin remitente", 3000000]] : [])
    ];
    const total = lines.reduce((s, l) => s + l[1], 0);

    let stamp, cls, note;
    if (kept && favoredDozsa) {
      stamp = "EXPEDIENTE ABIERTO"; cls = "bad";
      note = "Una denuncia anónima señala la entrada del minuto 63. Mañana tu nombre sale en la prensa deportiva.";
    } else if (nC >= 4) {

    } else if (nC >= 2) {
      stamp = "APROBADO CON RESERVAS"; cls = "mid";
      note = "La prensa critica tu arbitraje. Tu sitio en la lista internacional queda en el aire.";
    } else {

      note = "Te retiran de la lista internacional. No es así como querías terminar.";
    }

    if (state.bribe === "give") note += " El comité agradece que entregaras el sobre. Hay quien dice que eso aquí no se hace.";

    const sign = v => (v > 0 ? "+" : v < 0 ? "−" : "") + ft(v);
    const gradeTxt = { correct: "Correcta", partial: "Aceptable", wrong: "Error" };
    screen.innerHTML = `
      <section class="report">
        <div class="stamp ${cls}">${stamp}</div>
        <div class="rep-head">

          <h2>Final de Copa 2019 · Dunavölgy SE ${state.score.N} – ${state.score.S} Kőhegyi Dózsa</h2>
        </div>
        <div class="tablewrap">
          <table>
            <thead><tr><th>Min.</th><th>Jugada</th><th>Tu decisión</th><th>Lo correcto</th><th>Resultado</th></tr></thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td class="num">${r.inc.minute}'</td>
                  <td>${esc(r.inc.title)}</td>
                  <td>${esc(r.o.label)}</td>
                  <td>${esc(r.inc.truth)}<div class="why">${esc(r.inc.why)}</div></td>
                  <td class="res ${r.grade}">${gradeTxt[r.grade]}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <table class="pay">
          <tbody>
            ${lines.map(([l, v]) => `<tr><td>${esc(l)}</td><td class="num">${sign(v)}</td></tr>`).join("")}
            <tr class="total"><td>Total a cobrar</td><td class="num">${sign(total)}</td></tr>
          </tbody>
        </table>
        <p class="note"><b>Observaciones:</b> ${esc(note)}</p>
        <p class="note">Reputación final: <b>${state.rep}</b>/100 · Presión de grada final: <b>${state.pressure}</b>/100 · Revisiones VAR usadas: <b>${3 - state.varLeft}</b> de 3</p>
        <button class="btn primary" id="again" style="color:#1a1305">Continuar →</button>
      </section>`;
    $("#again").onclick = () => { state.screen = "epilogue"; render(); };
  }

  // ---------- Dibujo ----------
  // Mundo: x a lo largo del campo (portería en x=304), y a lo ancho, z altura. 1 unidad ≈ 18 cm.
  const CAMS = { ojos: "TU VISTA", tribuna: "CAM 1 · TRIBUNA", porteria: "CAM 2 · PORTERÍA", contra: "CAM 3 · CONTRACAMPO", cenital: "CAM 4 · CENITAL" };

  const focusPos = (inc, t) => at(inc.ents.find(e => e.id === inc.focus).k, t);
  const ballPos = (inc, t) => { const b = at(inc.ball, t); return { x: b.x, y: b.y, z: inc.ballZ ? at(inc.ballZ, t).x : 0 }; };
  const dorsal = e => e.gk ? "1" : e.id.replace(/\D/g, "");
  const teamColor = e => e.t === "N" ? (e.gk ? COL.gkN : COL.norte) : (e.gk ? COL.gkS : COL.sur);

  function draw() {
    const cv = $("#cv");
    if (!cv) return;
    const ctx = cv.getContext("2d");
    const inc = INCIDENTS[state.idx], varOn = state.cur.varOpen;
    const cam = varOn ? view.cam : "ojos";
    const zoom = varOn && view.zoom, line = varOn && view.line;
    if (cam === "cenital") drawTop(ctx, inc, view.t, zoom, line);
    else draw3D(ctx, inc, view.t, cam, zoom, line, varOn);
    const tc = $("#tc");
    if (tc) tc.textContent = varOn ? `${CAMS[cam]}${zoom ? " · ZOOM" : ""} · ${(view.t * LIVE_MS / 1000).toFixed(2)}s` : `TU VISTA · ${inc.minute}'`;
    const scrub = $("#scrub");
    if (scrub) scrub.value = Math.round(view.t * 1000);
    const zb = $("#zoom"), lb = $("#line");
    if (zb) zb.setAttribute("aria-pressed", String(view.zoom));
    if (lb) lb.setAttribute("aria-pressed", String(view.line));
    document.querySelectorAll("[data-cam]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cam === cam)));
  }

  // Segundo defensor más adelantado (el portero cuenta), medido por la parte del cuerpo más adelantada
  function offsideX(inc, t) {
    const xs = inc.ents.filter(e => e.t === "S").map(e => at(e.k, t).x + 1).sort((a, b) => b - a);
    return xs[1] ?? xs[0];
  }

  // ----- Cenital (pizarra) -----
  function drawPitch(ctx) {
    for (let i = 0; i < 17; i++) { ctx.fillStyle = i % 2 ? COL.pitch2 : COL.pitch; ctx.fillRect(i * 20, 0, 20, H); }
    ctx.strokeStyle = COL.chalk; ctx.lineWidth = 1;
    ctx.strokeRect(10.5, 6.5, 294, 188);
    ctx.strokeRect(256.5, 46.5, 48, 108);
    ctx.strokeRect(290.5, 74.5, 14, 52);
    ctx.fillStyle = COL.chalk; ctx.fillRect(272, 100, 1, 1);
    const a = Math.acos(-16 / 24);
    ctx.beginPath(); ctx.arc(272.5, 100.5, 24, a, 2 * Math.PI - a); ctx.stroke();
    ctx.beginPath(); ctx.arc(10.5, 100.5, 22, -Math.PI / 2, Math.PI / 2); ctx.stroke();
    ctx.fillStyle = "rgba(230,240,230,.25)"; ctx.fillRect(305, 90, 6, 20);
    ctx.fillStyle = COL.chalk; ctx.fillRect(304, 89, 7, 1); ctx.fillRect(304, 110, 7, 1);
  }

  function drawTop(ctx, inc, t, zoom, line) {
    const k = CW / W;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#08100b"; ctx.fillRect(0, 0, CW, CH);
    if (zoom) {
      const f = focusPos(inc, t), s = k * 3;
      ctx.setTransform(s, 0, 0, s, Math.round(CW / 2 - f.x * s), Math.round(CH / 2 - f.y * s));
    } else ctx.setTransform(k, 0, 0, k, 0, 0);
    drawPitch(ctx);
    if (line) {
      ctx.fillStyle = COL.amber;
      ctx.fillRect(offsideX(inc, t) - (zoom ? 0.15 : 0.35), 0, zoom ? 0.3 : 0.7, H);
    }
    for (const e of inc.ents) {
      const p = at(e.k, t);
      ctx.fillStyle = "rgba(0,0,0,.3)";
      ctx.beginPath(); ctx.ellipse(p.x + 1, p.y + 1.2, 3, 2, 0, 0, 7); ctx.fill();
      ctx.fillStyle = teamColor(e); ctx.strokeStyle = COL.dark; ctx.lineWidth = 0.6;
      ctx.beginPath();
      if (e.fall !== undefined && t >= e.fall) ctx.ellipse(p.x + 1, p.y, 4.6, 2.2, 0.35, 0, 7);
      else ctx.arc(p.x, p.y, 3, 0, 7);
      ctx.fill(); ctx.stroke();
      if (zoom) {
        ctx.fillStyle = COL.dark; ctx.font = "5px monospace"; ctx.textAlign = "center";
        ctx.fillText(dorsal(e), p.x, p.y + 1.7);
      }
    }
    const b = ballPos(inc, t);
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(b.x + 0.8 + b.z * 0.3, b.y + 0.8 + b.z * 0.3, 1.5, 0, 7); ctx.fill();
    ctx.fillStyle = COL.ball; ctx.strokeStyle = COL.dark; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, 1.6 + b.z * 0.05, 0, 7); ctx.fill(); ctx.stroke();
  }

  // ----- 3D: cámaras de televisión y tu vista -----
  // Estilo 16 bits: todo se dibuja a 320x200, píxel a píxel, y se amplía x2 sin suavizar.
  const LW = 320, LH = 200;
  const V = {
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
  };
  const NEAR = 2;
  function makeCam(pos, tgt, f) {
    const fw = V.norm(V.sub(tgt, pos)), right = V.norm(V.cross([0, 0, 1], fw)), up = V.cross(fw, right);
    return { pos, fw, right, up, f };
  }
  const toCam = (c, p) => { const d = V.sub(p, c.pos); return [V.dot(d, c.right), V.dot(d, c.up), V.dot(d, c.fw)]; };
  const scr = (c, q) => [LW / 2 + c.f * q[0] / q[2], LH / 2 - c.f * q[1] / q[2]];
  function proj(c, p) {
    const q = toCam(c, p);
    if (q[2] < NEAR) return null;
    const [x, y] = scr(c, q);
    return { x, y, s: c.f / q[2], d: q[2] };
  }
  const mkBuf = () => { const b = document.createElement("canvas"); b.width = LW; b.height = LH; return b; };
  const LBUF = mkBuf(), SBUF = mkBuf();

  // --- Primitivas de píxel (sin antialias) ---
  function clipSeg(x0, y0, x1, y1) {
    let t0 = 0, t1 = 1;
    const dx = x1 - x0, dy = y1 - y0, P = [-dx, dx, -dy, dy], Qv = [x0 + 4, LW + 4 - x0, y0 + 4, LH + 4 - y0];
    for (let i = 0; i < 4; i++) {
      if (P[i] === 0) { if (Qv[i] < 0) return null; continue; }
      const r = Qv[i] / P[i];
      if (P[i] < 0) { if (r > t1) return null; if (r > t0) t0 = r; }
      else { if (r < t0) return null; if (r < t1) t1 = r; }
    }
    return [x0 + t0 * dx, y0 + t0 * dy, x0 + t1 * dx, y0 + t1 * dy];
  }
  function pxLine(g, x0, y0, x1, y1, w, col) {
    const cl = clipSeg(x0, y0, x1, y1);
    if (!cl) return;
    [x0, y0, x1, y1] = cl.map(Math.round);
    g.fillStyle = col;
    const o = Math.floor((w - 1) / 2), dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (let n = 0; n < 1200; n++) {
      g.fillRect(x0 - o, y0 - o, w, w);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }
  function pxEllipse(g, cx, cy, rx, ry, col) {
    g.fillStyle = col; cx = Math.round(cx); cy = Math.round(cy);
    for (let dy = -ry; dy <= ry; dy++) { const h = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy / (ry + 0.5)) ** 2))); g.fillRect(cx - h, cy + dy, 2 * h + 1, 1); }
  }
  const pxDisc = (g, cx, cy, r, col) => pxEllipse(g, cx, cy, r, r, col);
  // Polígono convexo relleno por líneas de barrido
  function pxPoly(g, pts, col) {
    let y0 = Infinity, y1 = -Infinity;
    for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    y0 = Math.max(0, Math.floor(y0)); y1 = Math.min(LH - 1, Math.ceil(y1));
    g.fillStyle = col;
    for (let y = y0; y <= y1; y++) {
      const yc = y + 0.5;
      let lo = Infinity, hi = -Infinity;
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) {
          const x = a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0]);
          lo = Math.min(lo, x); hi = Math.max(hi, x);
        }
      }
      if (lo <= hi) { const xa = Math.max(0, Math.round(lo)), xb = Math.min(LW, Math.round(hi)); if (xb > xa) g.fillRect(xa, y, xb - xa, 1); }
    }
  }
  function poly3(g, c, pts, fill) {
    const qs = pts.map(p => toCam(c, p)), out = [];
    for (let i = 0; i < qs.length; i++) {
      const a = qs[i], b = qs[(i + 1) % qs.length], ai = a[2] >= NEAR, bi = b[2] >= NEAR;
      if (ai) out.push(a);
      if (ai !== bi) { const u = (NEAR - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, NEAR]); }
    }
    if (out.length >= 3) pxPoly(g, out.map(q => scr(c, q)), fill);
  }
  function seg3(g, c, a, b, w, col) {
    let qa = toCam(c, a), qb = toCam(c, b);
    if (qa[2] < NEAR && qb[2] < NEAR) return;
    if (qa[2] < NEAR || qb[2] < NEAR) {
      const u = (NEAR - qa[2]) / (qb[2] - qa[2]);
      const m = [qa[0] + (qb[0] - qa[0]) * u, qa[1] + (qb[1] - qa[1]) * u, NEAR];
      if (qa[2] < NEAR) qa = m; else qb = m;
    }
    const [x1, y1] = scr(c, qa), [x2, y2] = scr(c, qb);
    pxLine(g, x1, y1, x2, y2, w, col);
  }
  const DIGITS = { 0: "111101101101111", 1: "010110010010111", 2: "111001111100111", 3: "111001111001111", 4: "101101111001001",
    5: "111100111001111", 6: "111100111101111", 7: "111001001001001", 8: "111101111101111", 9: "111101111001111" };
  function pxNumber(g, str, cx, y, col) {
    const w = str.length * 4 - 1;
    let x = Math.round(cx - w / 2); y = Math.round(y);
    g.fillStyle = "#0b0f0c"; g.fillRect(x - 1, y - 1, w + 2, 7);
    g.fillStyle = col;
    for (const ch of str) {
      const m = DIGITS[ch];
      if (m) for (let i = 0; i < 15; i++) if (m[i] === "1") g.fillRect(x + (i % 3), y + ((i / 3) | 0), 1, 1);
      x += 4;
    }
  }

  // --- Color: sombreado y bruma de distancia ---
  const HAZE = [30, 42, 52];
  const hexRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function tone(h, k, fog) {
    const c = hexRGB(h).map((v, i) => { const x = Math.min(255, v * k); return x + (HAZE[i] - x) * fog; });
    return `rgb(${c.map(Math.round).join(",")})`;
  }

  // --- Estadio ---
  const TOWERS = [[-330, -40, 150], [350, -40, 150], [-330, 240, 150], [350, 240, 150]];
  function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
  const patterns = {};
  function pattern(g, key, size, paint) {
    if (!patterns[key]) { const cv = document.createElement("canvas"); cv.width = cv.height = size; paint(cv.getContext("2d")); patterns[key] = g.createPattern(cv, "repeat"); }
    return patterns[key];
  }
  const crowdPat = g => pattern(g, "crowd", 32, x => {
    x.fillStyle = "#10161d"; x.fillRect(0, 0, 32, 32);
    const r = seeded(9), cols = ["#2a3f52", "#3b5268", "#7cc4f0", "#5aa0cc", "#6a3f33", "#8a5a44", "#c9c2b4", "#1e2833"];
    for (let y = 0; y < 32; y += 2) for (let xx = (y / 2) % 2; xx < 32; xx += 2) { x.fillStyle = cols[(r() * cols.length) | 0]; x.fillRect(xx, y, 1, 1); }
  });
  const grassPat = g => pattern(g, "grass", 8, x => {
    const r = seeded(3);
    for (let y = 0; y < 8; y++) for (let xx = 0; xx < 8; xx++) { if (r() < 0.22) { x.fillStyle = r() < 0.5 ? "rgba(0,0,0,.18)" : "rgba(255,255,255,.07)"; x.fillRect(xx, y, 1, 1); } }
  });

  function drawStadium(g, c) {
    // cielo nocturno
    const sky = g.createLinearGradient(0, 0, 0, LH);
    sky.addColorStop(0, "#05080c"); sky.addColorStop(1, "#141d27");
    g.fillStyle = sky; g.fillRect(0, 0, LW, LH);
    // césped (campo completo, con la otra mitad) y franjas de corte
    poly3(g, c, [[-312, -12, 0], [332, -12, 0], [332, 212, 0], [-312, 212, 0]], "#2d6a3c");
    for (let x = -312, i = 0; x < 332; x += 21.5, i++) if (i % 2) poly3(g, c, [[x, -12, 0], [x + 21.5, -12, 0], [x + 21.5, 212, 0], [x, 212, 0]], "#367a46");
    poly3(g, c, [[-312, -12, 0], [332, -12, 0], [332, 212, 0], [-312, 212, 0]], grassPat(g));
    // gradas en los lados que la cámara tiene delante (las de detrás no se ven)
    const sides = [];
    const P = { N: (a, o, z) => [a, -12 - o, z], S: (a, o, z) => [a, 212 + o, z], W: (a, o, z) => [-312 - o, a, z], E: (a, o, z) => [332 + o, a, z] };
    if (c.pos[1] > -12) sides.push(["N", -400, 420, [10, -60]]);
    if (c.pos[1] < 212) sides.push(["S", -400, 420, [10, 260]]);
    if (c.pos[0] > -312) sides.push(["W", -100, 300, [-360, 100]]);
    if (c.pos[0] < 332) sides.push(["E", -100, 300, [380, 100]]);
    sides.sort((a, b) => Math.hypot(b[3][0] - c.pos[0], b[3][1] - c.pos[1]) - Math.hypot(a[3][0] - c.pos[0], a[3][1] - c.pos[1]));
    const crowd = crowdPat(g);
    for (const [k, a0, a1] of sides) {
      const f = P[k], step = (a1 - a0) / 8;
      for (let i = 0; i < 8; i++) {
        const a = a0 + i * step, b = a + step;
        poly3(g, c, [f(a, 0, 0), f(b, 0, 0), f(b, 0, 5), f(a, 0, 5)], "#1b232c");              // muro
        poly3(g, c, [f(a, 1, 5), f(b, 1, 5), f(b, 66, 44), f(a, 66, 44)], crowd);                // grada
        poly3(g, c, [f(a, 66, 44), f(b, 66, 44), f(b, 66, 58), f(a, 66, 58)], "#0b1016");        // fondo
        poly3(g, c, [f(a, 26, 58), f(b, 26, 58), f(b, 76, 64), f(a, 76, 64)], "#1a212a");        // techo
        poly3(g, c, [f(a, 26, 55), f(b, 26, 55), f(b, 26, 58), f(a, 26, 58)], "#2c3642");        // borde del techo
      }
      for (let i = 0; i < 20; i++) {
        const a = a0 + i * (a1 - a0) / 20, b = a + (a1 - a0) / 20;
        poly3(g, c, [f(a, -3, 0), f(b, -3, 0), f(b, -3, 3.4), f(a, -3, 3.4)], i % 2 ? "#1f4e8c" : "#d8a21c"); // vallas
      }
    }
    // torres de focos
    for (const T of TOWERS) {
      seg3(g, c, [T[0], T[1], 0], T, 1, "#1d252e");
      const q = proj(c, T);
      if (!q) continue;
      g.globalCompositeOperation = "lighter";
      pxDisc(g, q.x, q.y, 9, "rgba(255,236,190,.05)");
      pxDisc(g, q.x, q.y, 5, "rgba(255,236,190,.10)");
      g.globalCompositeOperation = "source-over";
      g.fillStyle = "#fff6dc"; g.fillRect(Math.round(q.x) - 2, Math.round(q.y) - 1, 5, 2);
    }
  }

  function drawMarkings(g, c, inc, t, line) {
    const COLL = "#e6eee2";
    const L = pts => { for (let i = 0; i < pts.length - 1; i++) seg3(g, c, [pts[i][0], pts[i][1], 0.05], [pts[i + 1][0], pts[i + 1][1], 0.05], 1, COLL); };
    const both = pts => { L(pts); L(pts.map(([x, y]) => [20 - x, y])); }; // la otra mitad es simétrica respecto a x=10
    L([[-284, 6], [304, 6], [304, 194], [-284, 194], [-284, 6]]);
    L([[10, 6], [10, 194]]);
    both([[304, 46], [256, 46], [256, 154], [304, 154]]);
    both([[304, 74], [290, 74], [290, 126], [304, 126]]);
    const a0 = Math.acos(-16 / 24), arc = [], cc = [];
    for (let i = 0; i <= 12; i++) { const a = a0 + (2 * Math.PI - 2 * a0) * i / 12; arc.push([272 + 24 * Math.cos(a), 100 + 24 * Math.sin(a)]); }
    for (let i = 0; i <= 32; i++) { const a = 2 * Math.PI * i / 32; cc.push([10 + 22 * Math.cos(a), 100 + 22 * Math.sin(a)]); }
    both(arc); L(cc); both([[271.5, 100], [272.5, 100]]);
    if (line) seg3(g, c, [offsideX(inc, t), 6, 0.1], [offsideX(inc, t), 194, 0.1], 1, COL.amber);
  }

  function drawGoal3(g, c, m) {
    const X = x => m ? 20 - x : x; // m: la portería del otro lado
    const NET = "rgba(235,240,235,.32)";
    for (let y = 90; y <= 110; y += 2.5) { seg3(g, c, [X(304), y, 14], [X(311), y, 11], 1, NET); seg3(g, c, [X(311), y, 0], [X(311), y, 11], 1, NET); }
    for (let z = 0; z <= 11; z += 2.2) seg3(g, c, [X(311), 90, z], [X(311), 110, z], 1, NET);
    for (const y of [90, 110]) for (let x = 304; x <= 311; x += 2.3) seg3(g, c, [X(x), y, 0], [X(x), y, 14 - (x - 304) * 3 / 7], 1, NET);
    const q = proj(c, [X(304), 100, 7]), w = q ? Math.max(1, Math.round(0.3 * q.s)) : 1;
    for (const [a, b] of [[[304, 90, 0], [304, 90, 14]], [[304, 110, 0], [304, 110, 14]], [[304, 90, 14], [304, 110, 14]]]) {
      seg3(g, c, [X(a[0]), a[1], a[2]], [X(b[0]), b[1], b[2]], w, "#f4f4f0");
    }
  }

  function cameraFor(kind, inc, t, zoom) {
    const fe = focusPos(inc, t), b = ballPos(inc, t);
    let pos, tgt, f;
    if (kind === "ojos") {
      // El árbitro sigue la jugada desde atrás y en diagonal, con algo de retraso
      const lb = ballPos(inc, Math.max(0, t - 0.15));
      pos = [clamp(lb.x - 40, 14, 262), clamp(lb.y + 24, 12, 188), 10];
      tgt = [b.x, b.y, 3]; f = 330;
    } else if (kind === "tribuna") { pos = [fe.x, 300, 85]; tgt = [fe.x, fe.y, 2]; f = 600; }
    else if (kind === "porteria") { pos = [352, 100 + (fe.y - 100) * 0.4, 28]; tgt = [fe.x, fe.y, 4]; f = 520; }
    else { pos = [fe.x, -100, 85]; tgt = [fe.x, fe.y, 2]; f = 600; }
    if (zoom) { f *= 3.5; tgt = [fe.x, fe.y, inc.focusZ ?? 4]; }
    return makeCam(pos, tgt, f * LW / 480);
  }

  function draw3D(ctx, inc, t, kind, zoom, line, labels) {
    const g = LBUF.getContext("2d");
    const c = cameraFor(kind, inc, t, zoom);
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
    drawStadium(g, c);
    drawMarkings(g, c, inc, t, line);
    const bodies = inc.ents.map(e => bodyWorld(e, inc, t));
    const b = ballPos(inc, t);
    drawShadows(g, c, bodies, b);
    // jugadores, balón y porterías, del más lejano al más cercano
    const depth = p => V.dot(V.sub(p, c.pos), c.fw);
    const objs = bodies.map(B => ({ d: depth([B.p.x, B.p.y, 4]), fn: () => drawPlayer3(g, c, B, labels) }));
    objs.push({ d: depth([b.x, b.y, b.z]), fn: () => drawBall3(g, c, b) });
    objs.push({ d: depth([307, 100, 7]), fn: () => drawGoal3(g, c, false) });
    objs.push({ d: depth([-287, 100, 7]), fn: () => drawGoal3(g, c, true) });
    objs.sort((p, q) => q.d - p.d).forEach(o => o.fn());
    // atmósfera: bruma de focos arriba y viñeta
    const hz = g.createLinearGradient(0, 0, 0, LH);
    hz.addColorStop(0, "rgba(40,52,62,.28)"); hz.addColorStop(0.5, "rgba(40,52,62,.06)"); hz.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = hz; g.fillRect(0, 0, LW, LH);
    const vg = g.createRadialGradient(LW / 2, LH / 2, LH * 0.45, LW / 2, LH / 2, LW * 0.72);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.45)");
    g.fillStyle = vg; g.fillRect(0, 0, LW, LH);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(LBUF, 0, 0, CW, CH);
  }

  function vel(k, t) {
    const t0 = Math.max(0, t - 0.01), t1 = Math.min(1, t + 0.01), a = at(k, t0), b = at(k, t1);
    return { x: (b.x - a.x) / (t1 - t0), y: (b.y - a.y) / (t1 - t0) };
  }
  // Hacia dónde mira un jugador: hacia donde corre; si está quieto, al punto indicado o al balón.
  function facing(e, inc, t) {
    const freeze = Math.min(e.fall ?? 2, e.slide ?? 2);
    const tt = t >= freeze ? freeze - 0.02 : t;
    const v = vel(e.k, tt), sp = Math.hypot(v.x, v.y);
    if (sp > 12) return { u: { x: v.x / sp, y: v.y / sp }, sp: t >= freeze ? 0 : sp };
    const p = at(e.k, t), tg = e.face ? { x: e.face[0], y: e.face[1] } : ballPos(inc, t);
    const dx = tg.x - p.x, dy = tg.y - p.y, d = Math.hypot(dx, dy) || 1;
    return { u: { x: dx / d, y: dy / d }, sp: 0 };
  }

  // Esqueleto en coordenadas locales [adelante, lado, altura]. Altura total ≈ 10 (1,80 m).
  function bodyLocal(e, inc, t, sp, p, u, v) {
    const running = sp > 12, ph = t * 44 + e.id.charCodeAt(1), sw = running ? Math.sin(ph) : 0, lift = running ? Math.cos(ph) : 0;
    const lean = running ? 0.55 : 0.08;
    const mix = (A, B, m) => A.map((x, i) => x + (B[i] - x) * m);
    const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
    const P = {
      pelvis: [0, 0, 5.0], neck: [lean, 0, 8.6], head: [lean + 0.12, 0, 9.4],
      footL: [sw * 1.9, 0.42, running ? Math.max(0, lift) * 0.9 : 0], footR: [-sw * 1.9, -0.42, running ? Math.max(0, -lift) * 0.9 : 0],
      handL: [-sw * 1.2 + 0.15, 1.2, 5.4], handR: [sw * 1.2 + 0.15, -1.2, 5.4], studs: false
    };
    let bend = running ? 0.6 : 0.2;
    if (e.arms === "tucked") { P.handL = [0.3, 0.98, 5.7]; P.handR = [0.3, -0.98, 5.7]; }
    if (e.kick) {
      const K = e.kick;
      const m = t < K.t0 ? 0 : t < K.t1 ? (t - K.t0) / (K.t1 - K.t0) : t < K.t2 ? 1 : clamp(1 - (t - K.t2) / 0.1, 0, 1);
      if (m > 0) {
        const tp = at(inc.ents.find(x => x.id === K.target).k, Math.min(t, K.t1));
        const dx = tp.x - p.x, dy = tp.y - p.y, a = dx * u.x + dy * u.y, b = dx * v.x + dy * v.y;
        P.footR = mix(P.footR, [a - 0.5, b * 0.9, K.h], m); P.footL = mix(P.footL, [-0.8, 0.5, 0], m);
        P.neck = mix(P.neck, [-1.1, 0, 8.2], m); P.head = mix(P.head, [-1.35, 0, 9.0], m); P.pelvis = mix(P.pelvis, [0, 0, 4.6], m);
        P.handL = mix(P.handL, [-0.6, 2.0, 7.0], m); P.handR = mix(P.handR, [-0.8, -1.8, 6.5], m);
        P.studs = m > 0.6; bend *= 1 - m;
      }
    }
    if (e.slide !== undefined && t >= e.slide) {
      const m = clamp((t - e.slide) / 0.08, 0, 1);
      P.pelvis = mix(P.pelvis, [-1, 0, 1.1], m); P.neck = mix(P.neck, [-3.4, 0, 3.0], m); P.head = mix(P.head, [-4.0, 0, 3.6], m);
      P.footR = mix(P.footR, [3.6, -0.3, 0.35], m); P.footL = mix(P.footL, [0.8, 0.6, 0.25], m);
      P.handL = mix(P.handL, [-2.6, 1.5, 0.3], m); P.handR = mix(P.handR, [-2.6, -1.5, 0.3], m);
    }
    if (e.dive && e.fall !== undefined && t >= e.fall) { P.handL = [1.5, 1.1, 10.8]; P.handR = [1.5, -1.1, 10.8]; }
    // Articulaciones derivadas a lo largo del tronco, así funcionan de pie, tirado o deslizando
    const axis = V.sub(P.neck, P.pelvis);
    const along = k => add(P.pelvis, axis.map(x => x * k));
    P.hipL = add(P.pelvis, [0, 0.42, 0]); P.hipR = add(P.pelvis, [0, -0.42, 0]);
    P.kneeL = add(mix(P.hipL, P.footL, 0.5), [bend, 0, 0.15]); P.kneeR = add(mix(P.hipR, P.footR, 0.5), [bend, 0, 0.15]);
    P.waistL = add(along(0.22), [0, 0.68, 0]); P.waistR = add(along(0.22), [0, -0.68, 0]);
    P.shL = add(along(0.94), [0, 1.02, 0]); P.shR = add(along(0.94), [0, -1.02, 0]);
    P.shortL = add(along(-0.2), [0, 0.8, 0]); P.shortR = add(along(-0.2), [0, -0.8, 0]);
    P.chest = along(0.94); P.waist = along(0.22);
    P.elbL = add(mix(P.shL, P.handL, 0.5), [-0.25, 0.1, 0]); P.elbR = add(mix(P.shR, P.handR, 0.5), [-0.25, -0.1, 0]);
    return P;
  }

  // Cuerpo en coordenadas del mundo (sirve para dibujar el sprite y sus sombras)
  function bodyWorld(e, inc, t) {
    const p = at(e.k, t), F = facing(e, inc, t), u = F.u, v = { x: -u.y, y: u.x };
    const P = bodyLocal(e, inc, t, F.sp, p, u, v);
    const th = e.fall !== undefined && t > e.fall ? clamp((t - e.fall) / 0.12, 0, 1) * 1.42 : 0;
    const W3 = q => {
      let [a, b, z] = q;
      if (th) { const a2 = a * Math.cos(th) + z * Math.sin(th); z = Math.max(0.2, z * Math.cos(th) - a * Math.sin(th)); a = a2; }
      return [p.x + a * u.x + b * v.x, p.y + a * u.y + b * v.y, z];
    };
    const pts = {};
    for (const k in P) if (Array.isArray(P[k])) pts[k] = W3(P[k]);
    let studs = null;
    if (P.studs) studs = [W3([P.footR[0] + 0.5, P.footR[1] - 0.35, P.footR[2]]), W3([P.footR[0] + 0.5, P.footR[1] + 0.35, P.footR[2]])];
    return { e, p, u, v, pts, studs };
  }

  // Sombras: una por cada torre de focos (la cruz típica de los partidos de noche) y sombra de contacto
  const LIMBS = [["hipL", "kneeL"], ["kneeL", "footL"], ["hipR", "kneeR"], ["kneeR", "footR"], ["shL", "elbL"], ["elbL", "handL"], ["shR", "elbR"], ["elbR", "handR"]];
  function drawShadows(g, c, bodies, ball) {
    const s = SBUF.getContext("2d");
    for (const T of TOWERS) {
      s.clearRect(0, 0, LW, LH);
      const onGround = P => { const f = P[2] / Math.max(1, T[2] - P[2]); return proj(c, [P[0] + (P[0] - T[0]) * f, P[1] + (P[1] - T[1]) * f, 0.03]); };
      for (const B of bodies) {
        const Q = {};
        for (const k in B.pts) Q[k] = onGround(B.pts[k]);
        const mid = proj(c, [B.p.x, B.p.y, 0]);
        if (!mid) continue;
        const w = m => Math.max(1, Math.round(m * mid.s));
        const ln = (a, b, ww) => { if (Q[a] && Q[b]) pxLine(s, Q[a].x, Q[a].y, Q[b].x, Q[b].y, ww, "#000"); };
        for (const [a, b] of LIMBS) ln(a, b, w(0.6));
        ln("waist", "chest", w(1.6)); ln("pelvis", "waist", w(1.3));
        if (Q.head) pxDisc(s, Q.head.x, Q.head.y, w(0.5), "#000");
      }
      const bq = onGround([ball.x, ball.y, ball.z + 0.65]);
      if (bq) pxDisc(s, bq.x, bq.y, 1, "#000");
      g.globalAlpha = 0.17; g.drawImage(SBUF, 0, 0); g.globalAlpha = 1;
    }
    // sombra de contacto bajo los pies
    s.clearRect(0, 0, LW, LH);
    for (const B of bodies) {
      const q = proj(c, [B.p.x, B.p.y, 0]);
      if (q) pxEllipse(s, q.x, q.y, Math.max(1, Math.round(1.3 * q.s)), Math.max(0, Math.round(0.35 * q.s)), "#000");
    }
    const bq = proj(c, [ball.x, ball.y, 0]);
    if (bq) pxEllipse(s, bq.x, bq.y, Math.max(1, Math.round(0.6 * bq.s)), 0, "#000");
    g.globalAlpha = 0.35; g.drawImage(SBUF, 0, 0); g.globalAlpha = 1;
  }

  function drawBall3(g, c, b) {
    const q = proj(c, [b.x, b.y, b.z + 0.65]);
    if (!q) return;
    const r = Math.max(1, Math.round(0.65 * q.s)), x = Math.round(q.x), y = Math.round(q.y);
    pxDisc(g, x, y, r + 1, "#0b0f0c");
    pxDisc(g, x, y, r, "#e9ecef");
    if (r >= 2) { pxDisc(g, x - 1, y - 1, r - 1, "#ffffff"); g.fillStyle = "#9aa3ab"; g.fillRect(x + r - 1, y, 1, r); }
  }

  // Kits: [camiseta, pantalón, medias]
  const KITS = { N: ["#7cc4f0", "#eef1f3", "#7cc4f0"], S: ["#f07a5a", "#2a2d33", "#f07a5a"] };
  const SKIN = "#d9a77e", HAIR = "#35241a", BOOT = "#141414";
  function drawPlayer3(g, c, B, labels) {
    const { e, p, u, v, pts } = B;
    const mid = proj(c, [p.x, p.y, 5]);
    if (!mid) return;
    const Q = {};
    for (const k in pts) Q[k] = proj(c, pts[k]);
    const s = mid.s, px = m => Math.max(1, Math.round(m * s));
    const fog = clamp((mid.d - 150) / 700, 0, 0.5);
    const [shirt, shorts, socks] = e.gk ? [teamColor(e), "#2a2d33", teamColor(e)] : KITS[e.t];
    // luz principal: la torre más cercana
    const T = TOWERS.reduce((a, b) => Math.hypot(b[0] - p.x, b[1] - p.y) < Math.hypot(a[0] - p.x, a[1] - p.y) ? b : a);
    const lx = T[0] - p.x, ly = T[1] - p.y, litL = (v.x * lx + v.y * ly) > 0; // ¿el lado izquierdo (L) mira a la luz?
    const col = (h, lit) => tone(h, lit === undefined ? 0.92 : lit ? 1.12 : 0.66, fog);
    const side = k => k.endsWith("L") ? litL : !litL;

    // formas: [tipo, puntos, grosor, color base, lado]
    const shapes = [];
    const limb = (a, b, w, h) => shapes.push(["l", [a, b], w, h, side(a)]);
    const quad = (ks, h, lit) => shapes.push(["p", ks, 0, h, lit]);
    // piernas y brazos del lado en sombra primero, luego tronco, luego el lado iluminado
    const legs = sd => { limb("hip" + sd, "knee" + sd, px(0.72), SKIN); limb("knee" + sd, "foot" + sd, px(0.58), socks); };
    const arm = sd => { limb("sh" + sd, "elb" + sd, px(0.6), shirt); limb("elb" + sd, "hand" + sd, px(0.46), SKIN); };
    const far = litL ? "R" : "L", near = litL ? "L" : "R";
    legs(far); arm(far);
    quad(["shortL", "shortR", "waistR", "waistL"], shorts);
    quad(["waistL", "waistR", "shR", "shL"], shirt);
    quad(litL ? ["waist", "waistR", "shR", "chest"] : ["waist", "waistL", "shL", "chest"], shirt, false); // mitad en sombra
    legs(near); arm(near);

    const paint = (mono, dx, dy) => {
      for (const [type, ks, w, h, lit] of shapes) {
        const q = ks.map(k => Q[k]);
        if (q.some(x => !x)) continue;
        const fill = mono || col(h, lit);
        if (type === "l") pxLine(g, q[0].x + dx, q[0].y + dy, q[1].x + dx, q[1].y + dy, w, fill);
        else pxPoly(g, q.map(o => [o.x + dx, o.y + dy]), fill);
      }
      for (const f of ["footL", "footR"]) if (Q[f]) {
        const w = px(0.95);
        g.fillStyle = mono || BOOT; g.fillRect(Math.round(Q[f].x) - (w >> 1) + dx, Math.round(Q[f].y) - 1 + dy, w + 1, Math.max(2, px(0.45)));
      }
      if (Q.head) pxDisc(g, Q.head.x + dx, Q.head.y + dy, Math.max(1, Math.round(0.62 * s)), mono || col(SKIN, true));
    };
    // contorno oscuro de 1 píxel, como los sprites de la época
    const OUT = tone("#0d120e", 1, fog * 0.5);
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) paint(OUT, dx, dy);
    paint(null, 0, 0);
    // brillo en el borde iluminado del torso
    if (s > 1.2 && Q.shL && Q.waistL && Q.shR && Q.waistR) {
      const [a, b] = litL ? [Q.shL, Q.waistL] : [Q.shR, Q.waistR];
      pxLine(g, a.x, a.y, b.x, b.y, 1, col(shirt, true));
    }
    if (B.studs) {
      const a = proj(c, B.studs[0]), b = proj(c, B.studs[1]);
      if (a && b) pxLine(g, a.x, a.y, b.x, b.y, Math.max(1, px(0.2)), "#f4f4f4");
    }
    // cabeza: pelo, cara en sombra y nuca si está de espaldas
    if (Q.head) {
      const r = Math.max(1, Math.round(0.62 * s)), hx = Math.round(Q.head.x), hy = Math.round(Q.head.y);
      const away = u.x * c.fw[0] + u.y * c.fw[1] > 0.3;
      g.fillStyle = col(HAIR, true);
      if (away) pxDisc(g, hx, hy, r, col(HAIR, true));
      else g.fillRect(hx - r, hy - r, 2 * r + 1, Math.max(1, Math.ceil(r * 0.8)));
      if (r >= 2) {
        const sx = (proj(c, [p.x + v.x, p.y + v.y, 9.4]) || Q.head).x > Q.head.x ? 1 : -1; // hacia dónde queda el lado L en pantalla
        const darkSide = litL ? -sx : sx;
        g.fillStyle = col(away ? HAIR : SKIN, false);
        g.fillRect(darkSide > 0 ? hx + 1 : hx - r, hy - r + 1, r, 2 * r - 1);
        if (!away && r >= 3) { g.fillStyle = "#1a1210"; g.fillRect(hx - 1, hy, 1, 1); g.fillRect(hx + 1, hy, 1, 1); }
      }
      if (labels) pxNumber(g, dorsal(e), Q.head.x, Q.head.y - r - 9, teamColor(e));
    }
  }

  // ---------- Arranque (conserva la partida si la página se actualiza) ----------
  window.claude?.hot?.snapshot?.(() => ({ state }));
  const start = data => { state = data && data.state && data.state.ref ? data.state : fresh(); render(); };
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
