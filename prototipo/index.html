  .tagline { font-family: var(--f-mono); font-size: 24px; line-height: 1.1; color: var(--muted); margin: 0 0 8px; }

  .mi small { font-family: var(--f-body); font-size: 13px; color: var(--muted); letter-spacing: .02em; }

  .report td.num, .report th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .res { font-weight: 700; }
  .res.correct { color: #2f7a3a; } .res.partial { color: #9a6a00; } .res.wrong { color: #b0271b; }
  .why { color: #4d473b; font-size: 14px; }
  .pay { max-width: 420px; }

  .rep-head { padding-right: 200px; }
  .stamp { position: absolute; top: 28px; right: 24px; transform: rotate(-9deg); font-family: var(--f-display); font-weight: 700; font-size: clamp(16px, 3vw, 26px); padding: 6px 12px; border: 4px solid currentColor; opacity: .85; text-align: center; line-height: 1.05; max-width: 45%; }

  .report .note { max-width: 62ch; margin: 0; }

  @media (prefers-reduced-motion: reduce) { .meter .fill { transition: none; } }
</style>

    }
    const l = keys[keys.length - 1];
    return { x: l[1], y: l[2] ?? 0 };
  }

  // Estadio nocturno pixelado detrás del menú
  function stadium() {
    const cv = $("#bg");
    if (!cv) return;
    const ctx = cv.getContext("2d"), w = 320, h = 180;
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const crowd = [];
    for (let y = 58; y < 104; y += 4) for (let x = 0; x < w; x += 3) crowd.push([x + rnd() * 2, y + rnd() * 2, rnd()]);
    const towers = [22, 108, 212, 298];
    const frame = n => {
      const g = ctx.createLinearGradient(0, 0, 0, 60);
      g.addColorStop(0, "#070a0f"); g.addColorStop(1, "#141d28");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      // haces de luz
      for (const x of towers) {
        ctx.fillStyle = "rgba(255,236,190,.05)";
        ctx.beginPath(); ctx.moveTo(x - 6, 20); ctx.lineTo(x + 6, 20); ctx.lineTo(x + 60, 150); ctx.lineTo(x - 60, 150); ctx.fill();
      }
      // grada
      ctx.fillStyle = "#101820"; ctx.fillRect(0, 54, w, 52);
      for (const [x, y, r] of crowd) {
        const flash = !RM && ((r * 997 + n * 0.37) % 1) < 0.004;
        ctx.fillStyle = flash ? "#ffffff" : r < 0.45 ? "#2c4a63" : r < 0.8 ? "#5a3a33" : "#39444f";
        ctx.fillRect(x, y, flash ? 2 : 1, flash ? 2 : 1);
      }
      // torres de focos
      for (const x of towers) {
        ctx.fillStyle = "#1c2630"; ctx.fillRect(x - 1, 20, 2, 36);
        ctx.fillStyle = "#fff4d6"; ctx.fillRect(x - 7, 14, 14, 6);
        ctx.fillStyle = "rgba(255,244,214,.18)"; ctx.fillRect(x - 10, 11, 20, 12);
      }
      // vallas publicitarias
      for (let x = 0; x < w; x += 32) { ctx.fillStyle = (x / 32) % 2 ? "#243b56" : "#8a6a24"; ctx.fillRect(x, 104, 32, 5); }
      // césped
      for (let i = 0; i < 16; i++) { ctx.fillStyle = i % 2 ? "#23502f" : "#275a35"; ctx.fillRect(i * 20, 109, 20, h - 109); }
      ctx.fillStyle = "rgba(223,232,216,.7)";
      ctx.fillRect(0, 140, w, 1); // línea de medio campo (en perspectiva)
      ctx.strokeStyle = "rgba(223,232,216,.7)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(160, 140.5, 44, 12, 0, 0, 7); ctx.stroke();
      // el árbitro, solo en el círculo central
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(157, 147, 8, 2);
      ctx.fillStyle = "#0b0b0b"; ctx.fillRect(158, 136, 5, 7);
      ctx.fillStyle = "#1a1a1a"; ctx.fillRect(158, 143, 2, 5); ctx.fillRect(161, 143, 2, 5);
      ctx.fillStyle = "#e3c9a8"; ctx.fillRect(159, 132, 3, 4);
      ctx.fillStyle = "#f0b43c"; ctx.fillRect(163, 138, 1, 1); // silbato
    };
    let n = 0, last = 0;
    const loop = now => {
      if (now - last > 120) { frame(n++); last = now; }
      view.bg = requestAnimationFrame(loop);
    };
    frame(0);
    if (!RM) view.bg = requestAnimationFrame(loop);
  }

      view.t = clamp((now - t0) / LIVE_MS, 0, 1);
      draw();
      if (view.t < 1) view.anim = requestAnimationFrame(step);
      else finishLive();
    };
    view.anim = requestAnimationFrame(step);
  }

  function finishLive() {
    const inc = INCIDENTS[state.idx];
    state.cur.watched = true;
    const msgs = [...inc.post, inc.varHint];
    let i = 0;
    const next = () => {
      if (i >= msgs.length) return;
      say(...msgs[i++]);
      if (i < msgs.length) setTimeout(next, RM ? 0 : 700);
    };
    next();
    renderDecide();
  }

  function openVar() {
    if (state.varLeft <= 0) return;
    state.varLeft--;
    state.extra += 2;
    state.pressure = clamp(state.pressure + 8, 0, 100);
    state.cur.varOpen = true;
    view.t = 0;
    say("TÚ", "Me voy a la pantalla. Revisión VAR.");
    say("GRADA", "Uuuuuh... (la grada se impacienta)");
    renderHud();
    $("#monitor").classList.add("var");
    $("#tag").textContent = "VAR · REVISIÓN";
    $("#varbar").hidden = false;
    renderDecide();
    draw();
  }

  function wireVar() {
    const scrub = $("#scrub");
    if (!scrub) return;
    const set = t => { stopSlow(); view.t = clamp(t, 0, 1); draw(); };
    scrub.oninput = () => set(scrub.value / 1000);
    $("#fb").onclick = () => set(view.t - 0.01);
    $("#ff").onclick = () => set(view.t + 0.01);
    document.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => set(+b.dataset.jump));
    const toggle = (id, key) => { const b = $(id); b.onclick = () => { view[key] = !view[key]; draw(); }; };
    toggle("#zoom", "zoom");
    toggle("#line", "line");
    document.querySelectorAll("[data-cam]").forEach(b => b.onclick = () => { view.cam = b.dataset.cam; draw(); });
    $("#slow").onclick = () => {
      if (view.slowing) { stopSlow(); return; }
      if (view.t >= 1) view.t = 0;
      view.slowing = true;
      $("#slow").setAttribute("aria-pressed", "true");
      let last = performance.now();
      const step = now => {
        view.t = clamp(view.t + (now - last) / (LIVE_MS * 4), 0, 1);
        last = now;
        draw();
        if (view.t < 1 && view.slowing) view.anim = requestAnimationFrame(step);
        else stopSlow();
      };
      view.anim = requestAnimationFrame(step);
    };
  }
  function stopSlow() {
    view.slowing = false;
    cancelAnimationFrame(view.anim);
    const b = $("#slow");
    if (b) b.setAttribute("aria-pressed", "false");
  }

  function decide(i) {
    const inc = INCIDENTS[state.idx], o = inc.options[i];
    stopSlow();
    state.cur.decided = i;
    state.decisions[state.idx] = i;
    state.pressure = clamp(state.pressure + o.pressure, 0, 100);
    state.rep = clamp(state.rep + (o.grade === "correct" ? 10 : o.grade === "partial" ? 3 : -10), 0, 100);
    if (o.goal) state.score[o.goal]++;
    say("TÚ", o.label + ".");
    say("GRADA", o.crowd);
    if (state.pressure >= 80) say("GRADA", "El ambiente es irrespirable. El delegado pide calma por megafonía.");
    renderHud();
    renderDecide();
  }

  function nextStep() {
    if (state.idx === HALF_AFTER && state.screen === "incident") { state.screen = "half"; render(); return; }
    state.extra = 0;
    if (state.idx >= INCIDENTS.length - 1) { state.screen = "report"; render(); return; }
    state.idx++;
    state.screen = "incident";
    startIncident();
  }

  // ---------- Descanso ----------
  function renderHalf() {
    save();
    const b = state.bribe;
    screen.innerHTML = `
      <section class="sheet">
        <p class="eyebrow">Descanso · Vestuario arbitral</p>
        <h2 class="title" style="font-size:clamp(26px,5vw,44px)">Un sobre en la taquilla</h2>
        <p class="lead">Encima de tu ropa hay un sobre que antes no estaba. Dentro hay <b>3 millones de forintos</b> en billetes y una nota:</p>
        <p class="lead" style="font-family:var(--f-mono);font-size:24px;color:var(--amber)">«Por un buen arbitraje en la segunda parte. Tus amigos de Kőhegy.»</p>
        ${b === null ? `
          <div class="row">
            <button class="btn" id="keep">Guardar el sobre en la mochila</button>
            <button class="btn" id="give">Entregarlo al delegado del partido</button>
          </div>` : `
          <p class="lead">${b === "keep" ? "Guardas el sobre. Nadie te ha visto. Eso crees." : "El delegado se lleva el sobre y toma nota. «Esto lo va a saber el comité», te dice."}</p>
          <button class="btn primary" id="cont">Salir a la segunda parte →</button>`}
      </section>`;
    if (b === null) {
      $("#keep").onclick = () => { state.bribe = "keep"; renderHalf(); };
      $("#give").onclick = () => { state.bribe = "give"; state.rep = clamp(state.rep + 5, 0, 100); renderHud(); renderHalf(); };
    } else {
      $("#cont").onclick = () => { state.idx++; state.screen = "incident"; startIncident(); };
    }
  }

  // ---------- Informe ----------
  function renderReport() {
    const PAY = { correct: 40000, partial: 10000, wrong: -50000 };
    const ft = v => Math.abs(v).toLocaleString("es-ES", { useGrouping: true }).replace(/,/g, ".") + " Ft";
    const rows = INCIDENTS.map((inc, i) => {
      const o = inc.options[state.decisions[i]];
      return { inc, o, grade: o.grade };
    });
    const count = g => rows.filter(r => r.grade === g).length;
    const nC = count("correct"), nP = count("partial"), nW = count("wrong");
    const kept = state.bribe === "keep";
    const favoredDozsa = rows[3].grade !== "correct";
    const fine = state.pressure >= 70 ? -30000 : 0;
    const lines = [
      ["Honorarios de la final", 180000],
      [`Bonificación por aciertos (${nC} × ${ft(PAY.correct)})`, nC * PAY.correct],
      ...(nP ? [[`Decisiones aceptables (${nP} × ${ft(PAY.partial)})`, nP * PAY.partial]] : []),
      ...(nW ? [[`Multas por errores (${nW} × ${ft(PAY.wrong)})`, nW * PAY.wrong]] : []),
      ...(fine ? [["Sanción por incidentes en la grada", fine]] : []),
      ...(kept ? [["Sobre sin remitente", 3000000]] : [])
    ];
    const total = lines.reduce((s, l) => s + l[1], 0);

    let stamp, cls, note;
    if (kept && favoredDozsa) {
      stamp = "EXPEDIENTE ABIERTO"; cls = "bad";
      note = "Una denuncia anónima señala la entrada del minuto 63. Mañana tu nombre sale en la prensa deportiva.";
    } else if (nC >= 4) {
      stamp = "APROBADO"; cls = "ok";
      note = "Una final limpia. En la federación ya se habla de ti para el próximo torneo internacional.";
    } else if (nC >= 2) {
      stamp = "APROBADO CON RESERVAS"; cls = "mid";
      note = "La prensa critica tu arbitraje. Tu sitio en la lista internacional queda en el aire.";
    } else {
      stamp = "SUSPENSO"; cls = "bad";
      note = "Te retiran de la lista internacional. No es así como querías terminar.";
    }
    if (kept && !favoredDozsa) note += " En Kőhegy alguien está muy enfadado contigo. Y sabe dónde vives.";
    if (state.bribe === "give") note += " El comité agradece que entregaras el sobre. Hay quien dice que eso aquí no se hace.";

    const sign = v => (v > 0 ? "+" : v < 0 ? "−" : "") + ft(v);
    const gradeTxt = { correct: "Correcta", partial: "Aceptable", wrong: "Error" };
    screen.innerHTML = `
      <section class="report">
        <div class="stamp ${cls}">${stamp}</div>
        <div class="rep-head">
          <p class="eyebrow">Comité de Árbitros · Informe de actuación · Árbitro: ${esc(fullName(state.ref))}</p>
          <h2>Final de Copa 2019 · Dunavölgy SE ${state.score.N} – ${state.score.S} Kőhegyi Dózsa</h2>
        </div>
        <div class="tablewrap">
          <table>
            <thead><tr><th>Min.</th><th>Jugada</th><th>Tu decisión</th><th>Lo correcto</th><th>Resultado</th></tr></thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td class="num">${r.inc.minute}'</td>
                  <td>${esc(r.inc.title)}</td>
                  <td>${esc(r.o.label)}</td>
                  <td>${esc(r.inc.truth)}<div class="why">${esc(r.inc.why)}</div></td>
                  <td class="res ${r.grade}">${gradeTxt[r.grade]}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <table class="pay">
          <tbody>
            ${lines.map(([l, v]) => `<tr><td>${esc(l)}</td><td class="num">${sign(v)}</td></tr>`).join("")}
            <tr class="total"><td>Total a cobrar</td><td class="num">${sign(total)}</td></tr>
          </tbody>
        </table>
        <p class="note"><b>Observaciones:</b> ${esc(note)}</p>
        <p class="note">Reputación final: <b>${state.rep}</b>/100 · Presión de grada final: <b>${state.pressure}</b>/100 · Revisiones VAR usadas: <b>${3 - state.varLeft}</b> de 3</p>
        <button class="btn primary" id="again" style="color:#1a1305">Continuar →</button>
      </section>`;
    $("#again").onclick = () => { state.screen = "epilogue"; render(); };
  }

  // ---------- Dibujo ----------
  // Mundo: x a lo largo del campo (portería en x=304), y a lo ancho, z altura. 1 unidad ≈ 18 cm.
  const CAMS = { ojos: "TU VISTA", tribuna: "CAM 1 · TRIBUNA", porteria: "CAM 2 · PORTERÍA", contra: "CAM 3 · CONTRACAMPO", cenital: "CAM 4 · CENITAL" };

  const focusPos = (inc, t) => at(inc.ents.find(e => e.id === inc.focus).k, t);
  const ballPos = (inc, t) => { const b = at(inc.ball, t); return { x: b.x, y: b.y, z: inc.ballZ ? at(inc.ballZ, t).x : 0 }; };
  const dorsal = e => e.gk ? "1" : e.id.replace(/\D/g, "");
  const teamColor = e => e.t === "N" ? (e.gk ? COL.gkN : COL.norte) : (e.gk ? COL.gkS : COL.sur);

  function draw() {
    const cv = $("#cv");
    if (!cv) return;
    const ctx = cv.getContext("2d");
    const inc = INCIDENTS[state.idx], varOn = state.cur.varOpen;
    const cam = varOn ? view.cam : "ojos";
    const zoom = varOn && view.zoom, line = varOn && view.line;
    if (cam === "cenital") drawTop(ctx, inc, view.t, zoom, line);
    else draw3D(ctx, inc, view.t, cam, zoom, line, varOn);
    const tc = $("#tc");
    if (tc) tc.textContent = varOn ? `${CAMS[cam]}${zoom ? " · ZOOM" : ""} · ${(view.t * LIVE_MS / 1000).toFixed(2)}s` : `TU VISTA · ${inc.minute}'`;
    const scrub = $("#scrub");
    if (scrub) scrub.value = Math.round(view.t * 1000);
    const zb = $("#zoom"), lb = $("#line");
    if (zb) zb.setAttribute("aria-pressed", String(view.zoom));
    if (lb) lb.setAttribute("aria-pressed", String(view.line));
    document.querySelectorAll("[data-cam]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cam === cam)));
  }

  // Segundo defensor más adelantado (el portero cuenta), medido por la parte del cuerpo más adelantada
  function offsideX(inc, t) {
    const xs = inc.ents.filter(e => e.t === "S").map(e => at(e.k, t).x + 1).sort((a, b) => b - a);
    return xs[1] ?? xs[0];
  }

  // ----- Cenital (pizarra) -----
  function drawPitch(ctx) {
    for (let i = 0; i < 17; i++) { ctx.fillStyle = i % 2 ? COL.pitch2 : COL.pitch; ctx.fillRect(i * 20, 0, 20, H); }
    ctx.strokeStyle = COL.chalk; ctx.lineWidth = 1;
    ctx.strokeRect(10.5, 6.5, 294, 188);
    ctx.strokeRect(256.5, 46.5, 48, 108);
    ctx.strokeRect(290.5, 74.5, 14, 52);
    ctx.fillStyle = COL.chalk; ctx.fillRect(272, 100, 1, 1);
    const a = Math.acos(-16 / 24);
    ctx.beginPath(); ctx.arc(272.5, 100.5, 24, a, 2 * Math.PI - a); ctx.stroke();
    ctx.beginPath(); ctx.arc(10.5, 100.5, 22, -Math.PI / 2, Math.PI / 2); ctx.stroke();
    ctx.fillStyle = "rgba(230,240,230,.25)"; ctx.fillRect(305, 90, 6, 20);
    ctx.fillStyle = COL.chalk; ctx.fillRect(304, 89, 7, 1); ctx.fillRect(304, 110, 7, 1);
  }

  function drawTop(ctx, inc, t, zoom, line) {
    const k = CW / W;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#08100b"; ctx.fillRect(0, 0, CW, CH);
    if (zoom) {
      const f = focusPos(inc, t), s = k * 3;
      ctx.setTransform(s, 0, 0, s, Math.round(CW / 2 - f.x * s), Math.round(CH / 2 - f.y * s));
    } else ctx.setTransform(k, 0, 0, k, 0, 0);
    drawPitch(ctx);
    if (line) {
      ctx.fillStyle = COL.amber;
      ctx.fillRect(offsideX(inc, t) - (zoom ? 0.15 : 0.35), 0, zoom ? 0.3 : 0.7, H);
    }
    for (const e of inc.ents) {
      const p = at(e.k, t);
      ctx.fillStyle = "rgba(0,0,0,.3)";
      ctx.beginPath(); ctx.ellipse(p.x + 1, p.y + 1.2, 3, 2, 0, 0, 7); ctx.fill();
      ctx.fillStyle = teamColor(e); ctx.strokeStyle = COL.dark; ctx.lineWidth = 0.6;
      ctx.beginPath();
      if (e.fall !== undefined && t >= e.fall) ctx.ellipse(p.x + 1, p.y, 4.6, 2.2, 0.35, 0, 7);
      else ctx.arc(p.x, p.y, 3, 0, 7);
      ctx.fill(); ctx.stroke();
      if (zoom) {
        ctx.fillStyle = COL.dark; ctx.font = "5px monospace"; ctx.textAlign = "center";
        ctx.fillText(dorsal(e), p.x, p.y + 1.7);
      }
    }
    const b = ballPos(inc, t);
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(b.x + 0.8 + b.z * 0.3, b.y + 0.8 + b.z * 0.3, 1.5, 0, 7); ctx.fill();
    ctx.fillStyle = COL.ball; ctx.strokeStyle = COL.dark; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, 1.6 + b.z * 0.05, 0, 7); ctx.fill(); ctx.stroke();
  }

  // ----- 3D: cámaras de televisión y tu vista -----
  const V = {
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
  };
  const NEAR = 2;
  function makeCam(pos, tgt, f) {
    const fw = V.norm(V.sub(tgt, pos)), right = V.norm(V.cross([0, 0, 1], fw)), up = V.cross(fw, right);
    return { pos, fw, right, up, f };
  }
  const toCam = (c, p) => { const d = V.sub(p, c.pos); return [V.dot(d, c.right), V.dot(d, c.up), V.dot(d, c.fw)]; };
  const scr = (c, q) => [CW / 2 + c.f * q[0] / q[2], CH / 2 - c.f * q[1] / q[2]];
  function proj(c, p) {
    const q = toCam(c, p);
    if (q[2] < NEAR) return null;
    const [x, y] = scr(c, q);
    return { x, y, s: c.f / q[2] };
  }
  function poly3(ctx, c, pts, fill) {
    const qs = pts.map(p => toCam(c, p)), out = [];
    for (let i = 0; i < qs.length; i++) {
      const a = qs[i], b = qs[(i + 1) % qs.length], ai = a[2] >= NEAR, bi = b[2] >= NEAR;
      if (ai) out.push(a);
      if (ai !== bi) { const u = (NEAR - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, NEAR]); }
    }
    if (out.length < 3) return;
    ctx.fillStyle = fill; ctx.beginPath();
    out.forEach((q, i) => { const [x, y] = scr(c, q); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath(); ctx.fill();
  }
  function seg3(ctx, c, a, b) {
    let qa = toCam(c, a), qb = toCam(c, b);
    if (qa[2] < NEAR && qb[2] < NEAR) return;
    if (qa[2] < NEAR || qb[2] < NEAR) {
      const u = (NEAR - qa[2]) / (qb[2] - qa[2]);
      const m = [qa[0] + (qb[0] - qa[0]) * u, qa[1] + (qb[1] - qa[1]) * u, NEAR];
      if (qa[2] < NEAR) qa = m; else qb = m;
    }
    const [x1, y1] = scr(c, qa), [x2, y2] = scr(c, qb);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  function cameraFor(kind, inc, t, zoom) {
    const fe = focusPos(inc, t), b = ballPos(inc, t);
    let pos, tgt, f;
    if (kind === "ojos") {
      // El árbitro sigue la jugada desde atrás y en diagonal, con algo de retraso
      const lb = ballPos(inc, Math.max(0, t - 0.15));
      pos = [clamp(lb.x - 40, 14, 262), clamp(lb.y + 24, 12, 188), 10];
      tgt = [b.x, b.y, 3]; f = 330;
    } else if (kind === "tribuna") { pos = [fe.x, 300, 85]; tgt = [fe.x, fe.y, 2]; f = 600; }
    else if (kind === "porteria") { pos = [352, 100 + (fe.y - 100) * 0.4, 28]; tgt = [fe.x, fe.y, 4]; f = 520; }
    else { pos = [fe.x, -100, 85]; tgt = [fe.x, fe.y, 2]; f = 600; }
    if (zoom) { f *= 3.5; tgt = [fe.x, fe.y, inc.focusZ ?? 4]; }
    return makeCam(pos, tgt, f);
  }

  let CROWD_IMG = null;
  function crowdImg() {
    if (CROWD_IMG) return CROWD_IMG;
    const cv = document.createElement("canvas"); cv.width = CW; cv.height = CH;
    const g = cv.getContext("2d");
    g.fillStyle = "#121a23"; g.fillRect(0, 0, CW, CH);
    let s = 5;
    const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const cols = ["#2c4a63", "#3a566e", "#7cc4f0", "#5a3a33", "#6b4a3a", "#39444f", "#7a8a96"];
    for (let y = 0; y < CH; y += 3) for (let x = 0; x < CW; x += 3) { g.fillStyle = cols[(r() * cols.length) | 0]; g.fillRect(x + ((r() * 2) | 0), y + ((r() * 2) | 0), 1, 1); }
    return (CROWD_IMG = cv);
  }

  function draw3D(ctx, inc, t, kind, zoom, line, labels) {
    const c = cameraFor(kind, inc, t, zoom);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(crowdImg(), 0, 0);
    // césped
    poly3(ctx, c, [[-80, -60, 0], [400, -60, 0], [400, 260, 0], [-80, 260, 0]], "#24522f");
    for (let i = 1; i < 24; i += 2) { const x = -80 + i * 20; poly3(ctx, c, [[x, -60, 0], [x + 20, -60, 0], [x + 20, 260, 0], [x, 260, 0]], "#2a5f38"); }
    // vallas publicitarias en el lado lejano
    const by = c.pos[1] > 100 ? -6 : 206;
    for (let x = -80, i = 0; x < 400; x += 32, i++) poly3(ctx, c, [[x, by, 0], [x + 32, by, 0], [x + 32, by, 4], [x, by, 4]], i % 2 ? "#243b56" : "#8a6a24");
    // líneas
    ctx.strokeStyle = "rgba(228,236,224,.9)"; ctx.lineWidth = 1; ctx.lineCap = "butt";
    const L = pts => { for (let i = 0; i < pts.length - 1; i++) seg3(ctx, c, [pts[i][0], pts[i][1], 0.05], [pts[i + 1][0], pts[i + 1][1], 0.05]); };
    L([[10, 6], [304, 6], [304, 194], [10, 194], [10, 6]]);
    L([[304, 46], [256, 46], [256, 154], [304, 154]]);
    L([[304, 74], [290, 74], [290, 126], [304, 126]]);
    const a0 = Math.acos(-16 / 24), arc = [], cc = [];
    for (let i = 0; i <= 12; i++) { const g = a0 + (2 * Math.PI - 2 * a0) * i / 12; arc.push([272 + 24 * Math.cos(g), 100 + 24 * Math.sin(g)]); }
    for (let i = 0; i <= 16; i++) { const g = -Math.PI / 2 + Math.PI * i / 16; cc.push([10 + 22 * Math.cos(g), 100 + 22 * Math.sin(g)]); }
    L(arc); L(cc); L([[271.5, 100], [272.5, 100]]);
    if (line) {
      const lx = offsideX(inc, t);
      ctx.strokeStyle = COL.amber; ctx.lineWidth = 2;
      seg3(ctx, c, [lx, 6, 0.1], [lx, 194, 0.1]);
    }
    // sombras
    ctx.fillStyle = "rgba(0,0,0,.32)";
    for (const e of inc.ents) {
      const p = at(e.k, t), q = proj(c, [p.x, p.y, 0]);
      if (q) { ctx.beginPath(); ctx.ellipse(q.x, q.y, Math.max(1.5, 1.6 * q.s), Math.max(0.8, 0.55 * q.s), 0, 0, 7); ctx.fill(); }
    }
    const b = ballPos(inc, t), bq = proj(c, [b.x, b.y, 0]);
    if (bq) { ctx.beginPath(); ctx.ellipse(bq.x, bq.y, Math.max(1, 0.6 * bq.s), Math.max(0.5, 0.25 * bq.s), 0, 0, 7); ctx.fill(); }
    // jugadores, balón y portería, del más lejano al más cercano
    const depth = p => V.dot(V.sub(p, c.pos), c.fw);
    const objs = inc.ents.map(e => { const p = at(e.k, t); return { d: depth([p.x, p.y, 4]), fn: () => drawPlayer3(ctx, c, e, inc, t, labels) }; });
    objs.push({ d: depth([b.x, b.y, b.z]), fn: () => drawBall3(ctx, c, b) });
    objs.push({ d: depth([307, 100, 7]), fn: () => drawGoal3(ctx, c) });
    objs.sort((p, q) => q.d - p.d).forEach(o => o.fn());
  }

  function drawGoal3(ctx, c) {
    ctx.lineCap = "butt";
    ctx.strokeStyle = "rgba(235,240,235,.28)"; ctx.lineWidth = 1;
    for (let y = 90; y <= 110; y += 2.5) { seg3(ctx, c, [304, y, 14], [311, y, 11]); seg3(ctx, c, [311, y, 0], [311, y, 11]); }
    for (let z = 0; z <= 11; z += 2.2) seg3(ctx, c, [311, 90, z], [311, 110, z]);
    for (const y of [90, 110]) for (let x = 304; x <= 311; x += 2.3) seg3(ctx, c, [x, y, 0], [x, y, 14 - (x - 304) * 3 / 7]);
    const q = proj(c, [304, 100, 7]);
    ctx.strokeStyle = "#f4f4f0"; ctx.lineWidth = q ? Math.max(1.5, 0.3 * q.s) : 1.5;
    seg3(ctx, c, [304, 90, 0], [304, 90, 14]); seg3(ctx, c, [304, 110, 0], [304, 110, 14]); seg3(ctx, c, [304, 90, 14], [304, 110, 14]);
  }

  function drawBall3(ctx, c, b) {
    const q = proj(c, [b.x, b.y, b.z + 0.65]);
    if (!q) return;
    const r = Math.max(1.4, 0.65 * q.s);
    ctx.fillStyle = COL.ball; ctx.strokeStyle = COL.dark; ctx.lineWidth = Math.max(0.6, r * 0.2);
    ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, 7); ctx.fill(); ctx.stroke();
  }

  function vel(k, t) {
    const t0 = Math.max(0, t - 0.01), t1 = Math.min(1, t + 0.01), a = at(k, t0), b = at(k, t1);
    return { x: (b.x - a.x) / (t1 - t0), y: (b.y - a.y) / (t1 - t0) };
  }
  // Hacia dónde mira un jugador: hacia donde corre; si está quieto, al punto indicado o al balón.
  function facing(e, inc, t) {
    const freeze = Math.min(e.fall ?? 2, e.slide ?? 2);
    const tt = t >= freeze ? freeze - 0.02 : t;
    const v = vel(e.k, tt), sp = Math.hypot(v.x, v.y);
    if (sp > 12) return { u: { x: v.x / sp, y: v.y / sp }, sp: t >= freeze ? 0 : sp };
    const p = at(e.k, t), tg = e.face ? { x: e.face[0], y: e.face[1] } : ballPos(inc, t);
    const dx = tg.x - p.x, dy = tg.y - p.y, d = Math.hypot(dx, dy) || 1;
    return { u: { x: dx / d, y: dy / d }, sp: 0 };
  }

  // Puntos del cuerpo en coordenadas locales: [adelante, lado, altura]
  function bodyLocal(e, inc, t, sp, p, u, v) {
    const running = sp > 12, sw = running ? Math.sin(t * 44 + e.id.charCodeAt(1)) : 0;
    const lean = running ? 0.6 : 0.1;
    const P = {
      hip: [0, 0, 5.2], neck: [lean, 0, 8.6], head: [lean + 0.15, 0, 9.75],
      footL: [sw * 2, 0.7, running ? Math.max(0, sw) * 0.9 : 0], footR: [-sw * 2, -0.7, running ? Math.max(0, -sw) * 0.9 : 0],
      handL: [-sw * 1.3 + 0.1, 1.45, 5.9], handR: [sw * 1.3 + 0.1, -1.45, 5.9], studs: false
    };
    const mix = (A, B, m) => A.map((x, i) => x + (B[i] - x) * m);
    if (e.arms === "tucked") { P.handL = [0.35, 1.05, 5.9]; P.handR = [0.35, -1.05, 5.9]; }
    if (e.kick) {
      const K = e.kick;
      const m = t < K.t0 ? 0 : t < K.t1 ? (t - K.t0) / (K.t1 - K.t0) : t < K.t2 ? 1 : clamp(1 - (t - K.t2) / 0.1, 0, 1);
      if (m > 0) {
        const tp = at(inc.ents.find(x => x.id === K.target).k, Math.min(t, K.t1));
        const dx = tp.x - p.x, dy = tp.y - p.y, a = dx * u.x + dy * u.y, b = dx * v.x + dy * v.y;
        P.footR = mix(P.footR, [a - 0.5, b * 0.9, K.h], m); P.footL = mix(P.footL, [-0.8, 0.7, 0], m);
        P.neck = mix(P.neck, [-1.1, 0, 8.2], m); P.head = mix(P.head, [-1.4, 0, 9.3], m); P.hip = mix(P.hip, [0, 0, 4.6], m);
        P.studs = m > 0.6;
      }
    }
    if (e.slide !== undefined && t >= e.slide) {
      const m = clamp((t - e.slide) / 0.08, 0, 1);
      P.hip = mix(P.hip, [-1, 0, 1.2], m); P.neck = mix(P.neck, [-3.4, 0, 3.2], m); P.head = mix(P.head, [-4.2, 0, 3.9], m);
      P.footR = mix(P.footR, [3.6, -0.3, 0.35], m); P.footL = mix(P.footL, [0.8, 0.9, 0.25], m);
      P.handL = mix(P.handL, [-2.6, 1.6, 0.3], m); P.handR = mix(P.handR, [-2.6, -1.6, 0.3], m);
    }
    if (e.dive && e.fall !== undefined && t >= e.fall) { P.handL = [1.6, 1.2, 11]; P.handR = [1.6, -1.2, 11]; }
    const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
    P.hipL = add(P.hip, [0, 0.6, 0]); P.hipR = add(P.hip, [0, -0.6, 0]);
    P.shL = add(P.neck, [0, 1.0, -0.3]); P.shR = add(P.neck, [0, -1.0, -0.3]);
    P.elbL = mix(P.shL, P.handL, 0.45); P.elbR = mix(P.shR, P.handR, 0.45);
    return P;
  }

  function drawPlayer3(ctx, c, e, inc, t, labels) {
    const p = at(e.k, t), F = facing(e, inc, t), u = F.u, v = { x: -u.y, y: u.x };
    const P = bodyLocal(e, inc, t, F.sp, p, u, v);
    const th = e.fall !== undefined && t > e.fall ? clamp((t - e.fall) / 0.12, 0, 1) * 1.42 : 0;
    const W3 = q => {
      let [a, b, z] = q;
      if (th) { const a2 = a * Math.cos(th) + z * Math.sin(th); z = Math.max(0.2, z * Math.cos(th) - a * Math.sin(th)); a = a2; }
      return [p.x + a * u.x + b * v.x, p.y + a * u.y + b * v.y, z];
    };
    const Q = {};
    for (const k in P) if (Array.isArray(P[k])) Q[k] = proj(c, W3(P[k]));
    const mid = proj(c, [p.x, p.y, 5]);
    if (!mid) return;
    const s = mid.s, lw = m => Math.max(1, m * s);
    const ln = (a, b, col, w) => {
      if (!Q[a] || !Q[b]) return;
      ctx.strokeStyle = col; ctx.lineWidth = lw(w);
      ctx.beginPath(); ctx.moveTo(Q[a].x, Q[a].y); ctx.lineTo(Q[b].x, Q[b].y); ctx.stroke();
    };
    const col = teamColor(e), shorts = e.t === "N" ? "#eef2f4" : "#23262b", skin = "#d9b896";
    ctx.lineCap = "round";
    ln("hipL", "footL", skin, 0.6); ln("hipR", "footR", skin, 0.6);
    ctx.fillStyle = "#111";
    for (const f of ["footL", "footR"]) if (Q[f]) { const r = Math.max(1, 0.45 * s); ctx.fillRect(Q[f].x - r, Q[f].y - r, 2 * r, 2 * r); }
    if (P.studs) {
      // tacos por delante, mirando al rival
      ctx.fillStyle = "#e8e8e8";
      const r = Math.max(0.8, 0.16 * s);
      for (const k of [-0.3, 0, 0.3]) { const q = proj(c, W3([P.footR[0] + 0.5, P.footR[1] + k, P.footR[2]])); if (q) ctx.fillRect(q.x - r, q.y - r, 2 * r, 2 * r); }
    }
    ln("hipL", "hipR", shorts, 1.1);
    ln("hip", "neck", col, 1.9);
    ln("shL", "handL", skin, 0.5); ln("shR", "handR", skin, 0.5);
    ln("shL", "elbL", col, 0.62); ln("shR", "elbR", col, 0.62);
    if (Q.head) {
      const r = Math.max(1.3, 0.85 * s);
      ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(Q.head.x, Q.head.y, r, 0, 7); ctx.fill();
      ctx.fillStyle = "#2b211a"; ctx.beginPath(); ctx.arc(Q.head.x, Q.head.y - r * 0.25, r * 0.85, Math.PI, 0); ctx.fill();
      if (labels) {
        ctx.font = "16px VT323, monospace"; ctx.textAlign = "center";
        ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.fillStyle = col;
        const y = Q.head.y - r - 4;
        ctx.strokeText(dorsal(e), Q.head.x, y); ctx.fillText(dorsal(e), Q.head.x, y);
      }
    }
  }

  // ---------- Arranque (conserva la partida si la página se actualiza) ----------
  window.claude?.hot?.snapshot?.(() => ({ state }));
  const start = data => { state = data && data.state && data.state.ref ? data.state : fresh(); render(); };
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
