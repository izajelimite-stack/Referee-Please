<title>Referee, Please</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
  /* Un solo tema a propósito: la cabina VAR es oscura. */
  :root {
    color-scheme: dark;
    --booth: #0f1418;
    --panel: #172027;
    --panel2: #1d2831;
    --line: #2b3a45;
    --ink: #e5ebe3;
    --muted: #8d9ea6;
    --amber: #f0b43c;
    --amber-ink: #1a1305;
    --norte: #7cc4f0;
    --sur: #f07a5a;
    --good: #7fd08a;
    --bad: #e5533f;
    --live: #e5533f;
    --f-display: "Silkscreen", "Courier New", monospace;
    --f-mono: "VT323", "Courier New", monospace;
    --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--booth); color: var(--ink); }
  body { font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  #app { max-width: 1120px; margin: 0 auto; padding-block: 16px 40px; padding-inline: 16px; display: grid; gap: 16px; }

  /* Marcador */
  .hud { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); }
  .score { font-family: var(--f-mono); font-size: 30px; line-height: 1; display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
  .score .t { font-size: 22px; padding: 2px 6px; color: var(--booth); }
  .score .t.n { background: var(--norte); }
  .score .t.s { background: var(--sur); }
  .clock { font-family: var(--f-mono); font-size: 30px; line-height: 1; color: var(--amber); font-variant-numeric: tabular-nums; }
  .meters { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-left: auto; align-items: center; }
  .meter { display: grid; gap: 3px; min-width: 120px; }
  .meter label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; }
  .meter .bar { height: 8px; background: var(--booth); border: 1px solid var(--line); }
  .meter .fill { height: 100%; transition: width .4s; }
  .varpips { display: flex; gap: 4px; align-items: center; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .pip { width: 10px; height: 14px; border: 1px solid var(--amber); }
  .pip.on { background: var(--amber); }

  /* Pantallas de texto */
  .sheet { background: var(--panel); border: 1px solid var(--line); padding: clamp(20px, 4vw, 40px); display: grid; gap: 18px; }
  .title { font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 8vw, 72px); line-height: .95; letter-spacing: .01em; margin: 0; text-wrap: balance; }
  .title span { color: var(--amber); }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0; }
  .lead { font-size: 19px; max-width: 60ch; margin: 0; }
  .how { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; max-width: 62ch; }
  .how li { padding-left: 16px; border-left: 3px solid var(--line); }
  .how b { color: var(--amber); font-weight: 600; }

  .btn { cursor: pointer; border: 1px solid var(--line); background: var(--panel2); padding: 10px 14px; text-align: left; }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); font-weight: 700; justify-self: start; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn.var { border-color: var(--amber); color: var(--amber); font-weight: 600; }
  .btn[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }

  /* Partido */
  .stage { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }
  .left { display: grid; gap: 10px; }
  .monitor { position: relative; border: 2px solid var(--line); background: #000; }
  .monitor.var { border-color: var(--amber); }
  .monitor canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; image-rendering: pixelated; image-rendering: crisp-edges; }
  .monitor::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); }
  .tag { position: absolute; top: 8px; left: 8px; font-family: var(--f-mono); font-size: 20px; line-height: 1; padding: 3px 8px 4px; background: var(--live); color: #fff; z-index: 1; }
  .monitor.var .tag { background: var(--amber); color: var(--amber-ink); }
  .tc { position: absolute; right: 8px; bottom: 6px; font-family: var(--f-mono); font-size: 20px; color: #fff; text-shadow: 0 1px 0 #000; z-index: 1; font-variant-numeric: tabular-nums; }
  .playover { position: absolute; inset: 0; margin: auto; width: max-content; height: max-content; z-index: 2; font-family: var(--f-display); font-size: 18px; padding: 14px 20px; background: var(--amber); color: var(--amber-ink); border: 0; cursor: pointer; }

  .varbar { display: grid; gap: 10px; padding: 12px; background: var(--panel); border: 1px solid var(--amber); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row input[type=range] { flex: 1 1 160px; accent-color: var(--amber); min-width: 0; }
  .row .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .btn.sm { padding: 6px 10px; font-size: 14px; }
  .seg { display: inline-flex; }
  .seg .btn + .btn { border-left: 0; }

  .side { display: grid; gap: 14px; }
  .case { display: grid; gap: 4px; }
  .case h2 { font-family: var(--f-display); font-size: 22px; line-height: 1.1; margin: 0; text-wrap: balance; }
  .log { list-style: none; margin: 0; padding: 10px 12px; display: grid; gap: 8px; background: #0b1013; border: 1px solid var(--line); font-family: var(--f-mono); font-size: 20px; line-height: 1.1; max-height: 280px; overflow-y: auto; }
  .log li { display: grid; gap: 1px; }
  .log .who { font-size: 16px; letter-spacing: .06em; }
  .who.ASISTENTE { color: var(--norte); }
  .who.SALA { color: var(--amber); }
  .who.GRADA { color: var(--sur); }
  .who.TU { color: var(--good); }
  .who.COMITE { color: var(--muted); }
  .decide { display: grid; gap: 8px; }
  .decide h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
  .opt { display: flex; gap: 10px; align-items: center; font-weight: 600; }
  .opt .card { width: 12px; height: 16px; flex: none; border: 1px solid rgba(0,0,0,.4); }
  .card.y { background: #f2cf3a; } .card.r { background: #d9352a; } .card.w { background: var(--ink); } .card.g { background: var(--good); }
  .hint { font-size: 14px; color: var(--muted); margin: 0; }

  .whistle { font-family: var(--f-display); font-size: 22px; padding: 12px; cursor: pointer; background: var(--live); color: #fff; border: 0; display: flex; gap: 12px; align-items: baseline; justify-content: center; }
  .whistle small { font-family: var(--f-body); font-size: 12px; opacity: .8; }
  .whistle.hot { background: #ff3b2a; box-shadow: 0 0 0 3px var(--amber); animation: pulse .7s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.025); } }
  @media (prefers-reduced-motion: reduce) { .whistle.hot { animation: none; } }
  .ask { position: absolute; inset: 0; margin: auto; width: max-content; height: max-content; z-index: 2; pointer-events: none;
    font-family: var(--f-display); font-size: clamp(22px, 5vw, 40px); color: #fff; background: rgba(11,14,18,.72); padding: 10px 20px; display: flex; gap: 14px; align-items: baseline; border: 2px solid var(--amber); }
  .ask b { color: var(--amber); }
  .report .caso { font-size: 13px; color: #7a5a14; font-style: italic; margin-top: 3px; }
  .whistle:disabled { background: var(--panel2); color: var(--muted); cursor: default; }
  .cardsbox { display: grid; gap: 6px; }
  .cardsbox h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
  .cardsbox ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--f-mono); font-size: 20px; }
  .cardsbox li { display: flex; gap: 6px; align-items: center; }
  .cardsbox .card { width: 10px; height: 14px; border: 1px solid rgba(0,0,0,.4); }
  .meterset { display: flex; flex-wrap: wrap; gap: 10px 20px; }
  .meter label i { font-style: normal; text-transform: none; letter-spacing: 0; opacity: .75; }
  .meter.warn label { color: var(--bad); }
  /* ===== Pantalla de juego (partido rápido) ===== */
  .game { max-width: 1100px; width: 100%; margin-inline: auto; background: #0b0e12; border: 3px solid #0b0e12; box-shadow: 0 0 0 2px #3d4854; }
  .scorebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 12px; background: #101418; border-bottom: 2px solid #2a323d; font-family: var(--f-mono); }
  .sb-score { display: flex; align-items: center; gap: 8px; font-size: 28px; line-height: 1; }
  .sb-score .t { font-size: 20px; padding: 1px 6px; }
  .sb-score em { font-style: normal; color: #5d6b78; }
  .sb-min { font-size: 28px; line-height: 1; color: var(--amber); }
  .sb-gauges { display: flex; gap: 10px; margin-left: auto; }
  .gauge { width: 88px; display: grid; gap: 3px; }
  .gauge span { font-family: var(--f-body); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #5d6b78; }
  .gauge .trk { display: block; height: 6px; background: #1a1f27; }
  .gauge i { display: block; height: 100%; background: #3d4854; }
  .gauge.hot1 span { color: var(--amber); } .gauge.hot1 i { background: var(--amber); }
  .gauge.hot2 span { color: var(--bad); } .gauge.hot2 i { background: var(--bad); }
  .sb-cards { display: flex; flex-wrap: wrap; gap: 4px; font-size: 16px; }
  .mini { padding: 0 4px; color: #0b0e12; } .mini.y { background: #f2c81c; } .mini.r { background: #d8232a; color: #f4f4ee; }
  .sb-cards .none { color: #5d6b78; font-size: 15px; }
  .sb-var { display: flex; gap: 3px; align-items: center; font-size: 16px; color: #8a98a4; }
  .sb-var .pip { display: inline-block; width: 8px; height: 12px; border: 1px solid var(--amber); }
  .sb-var .pip.on { background: var(--amber); }
  .sb-rules { font-family: var(--f-mono); font-size: 16px; background: none; border: 1px solid #3d4854; color: #8a98a4; padding: 2px 8px; cursor: pointer; }
  .view { position: relative; }
  .view > canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; image-rendering: pixelated; }
  .view::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; background: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px); }
  .view.var { box-shadow: inset 0 0 0 3px var(--amber); }
  .view .tag { z-index: 2; }
  .view .tc { z-index: 2; top: 44px; bottom: auto; right: 10px; font-size: 16px; opacity: .8; }
  .view.var .tag { background: var(--amber); color: var(--amber-ink); }
  .ticker { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); max-width: 62%; z-index: 2; font-family: var(--f-mono); font-size: 20px; line-height: 1.1; padding: 3px 10px; background: rgba(11,14,18,.78); text-align: center; color: #8a98a4; }
  .ticker:empty { display: none; }
  .ticker.crowd, .v-crowd.crowd { color: #f6b39a; } .ticker.warn, .v-crowd.warn { color: #ff5a4a; } .ticker.you, .v-crowd.you { color: #5ad07a; }
  .view .ask { z-index: 3; }
  .ov { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; padding: 12px; display: grid; gap: 8px; }
  .ov.bottom { padding: 0; }
  .ov > .pill { justify-self: center; }
  .dlg { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; background: #0b0e12; border: 2px solid #f4f4ee; box-shadow: inset 0 0 0 2px #3d4854; padding: 10px 12px; }
  .dlg .face { width: 64px; height: 64px; image-rendering: pixelated; border: 2px solid #3d4854; }
  .dlg-who { font-family: var(--f-display); font-size: 13px; color: var(--amber); }
  .dlg-text { font-family: var(--f-mono); font-size: 22px; line-height: 1.1; margin: 4px 0 8px; color: #f4f4ee; min-height: 2.2em; }
  .dlg-actions, .dlg-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .dlg-row { justify-content: flex-end; }
  .pill { font-family: var(--f-display); font-size: 13px; padding: 8px 12px; background: #f4f4ee; color: #0b0e12; border: 0; cursor: pointer; box-shadow: 0 3px 0 #8a98a4; }
  .pill:hover { background: #fff27a; }
  .pill:focus-visible, .who:focus-visible, .opt-tile:focus-visible, .whistle-fab:focus-visible { outline: 2px solid #fff27a; outline-offset: 2px; }
  .pill.amber { background: var(--amber); box-shadow: 0 3px 0 #8a6a14; }
  .pill.ghost { background: transparent; color: #f4f4ee; box-shadow: inset 0 0 0 2px #5d6b78; }
  .pill.small { font-size: 11px; padding: 6px 10px; justify-self: start; }
  .panel { background: rgba(11,14,18,.93); border: 2px solid #f4f4ee; box-shadow: inset 0 0 0 2px #3d4854; padding: 10px 12px; display: grid; gap: 8px; }
  .panel-title { font-family: var(--f-display); font-size: 16px; margin: 0; color: #f4f4ee; }
  .panel-hint { margin: 0; font-size: 12px; color: #8a98a4; }
  .who-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .who { display: grid; justify-items: center; gap: 4px; background: #1a1f27; border: 2px solid #3d4854; padding: 8px 4px; color: #f4f4ee; cursor: pointer; font: 600 12px var(--f-body); }
  .who:hover:not(:disabled) { border-color: #f2d65c; }
  .who.sel { border-color: var(--amber); }
  .who.done span::after { content: " ✓"; color: #5ad07a; }
  .who:disabled { opacity: .4; cursor: default; }
  .wface { width: 48px; height: 48px; image-rendering: pixelated; }
  .tvicon { width: 48px; height: 48px; box-sizing: border-box; border: 4px solid #8a98a4; background: repeating-linear-gradient(0deg, #1f3470 0 3px, #12307a 3px 6px); }
  .tray-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .opt-tile { display: flex; gap: 10px; align-items: center; text-align: left; background: #1a1f27; color: #f4f4ee; border: 2px solid #3d4854; padding: 10px; cursor: pointer; font: 600 14px var(--f-body); }
  .opt-tile:hover { border-color: #f2d65c; background: #2a323d; }
  .icons { display: flex; gap: 4px; flex: none; }
  .ic { display: inline-block; flex: none; width: 18px; height: 24px; }
  .ic-y { background: #f2c81c; border: 1px solid #0b0e12; } .ic-r { background: #d8232a; border: 1px solid #0b0e12; }
  .ic-pen { width: 24px; height: 24px; background: radial-gradient(circle, #f4f4ee 0 3px, #377444 4px); }
  .ic-goal, .ic-no { width: 26px; height: 20px; border: 3px solid #f4f4ee; border-bottom: 0; background: repeating-linear-gradient(45deg, #5d6b78 0 2px, transparent 2px 5px); }
  .ic-no { background: linear-gradient(45deg, transparent 44%, #d8232a 44% 58%, transparent 58%), linear-gradient(-45deg, transparent 44%, #d8232a 44% 58%, transparent 58%); }
  .ic-flag { width: 20px; background: linear-gradient(#f2c81c 0 50%, #d8232a 50%) no-repeat 5px 0 / 15px 12px, linear-gradient(#c8d0d6, #c8d0d6) no-repeat 2px 0 / 3px 24px; }
  .ic-go { width: 22px; background: #5ad07a; clip-path: polygon(15% 10%, 90% 50%, 15% 90%); }
  .ic-foul { width: 24px; height: 14px; margin-top: 5px; background: #c8d0d6; border-radius: 7px 2px 2px 7px; }
  .verdict { justify-self: center; text-align: center; background: rgba(11,14,18,.92); border: 2px solid #f4f4ee; box-shadow: inset 0 0 0 2px #3d4854; padding: 14px 18px; display: grid; gap: 6px; justify-items: center; }
  .v-label { font-family: var(--f-display); font-size: 20px; margin: 0; color: #f4f4ee; }
  .v-crowd { margin: 0; font-family: var(--f-mono); font-size: 20px; }
  .whistle-fab { position: absolute; right: 14px; bottom: 14px; z-index: 4; display: grid; justify-items: center; font-family: var(--f-display); font-size: 18px; padding: 12px 16px; background: var(--live); color: #fff; border: 0; box-shadow: 0 4px 0 #8e1418; cursor: pointer; }
  .whistle-fab small { font-family: var(--f-mono); font-size: 14px; opacity: .85; }
  .whistle-fab.hot { background: #ff3b2a; box-shadow: 0 0 0 3px var(--amber), 0 4px 0 #8e1418; animation: pulse .7s ease-in-out infinite alternate; }
  @media (prefers-reduced-motion: reduce) { .whistle-fab.hot { animation: none; } }
  .varpanel { background: rgba(11,14,18,.92); border-top: 2px solid var(--amber); padding: 8px; display: grid; gap: 6px; }
  .varpanel .row { gap: 6px; }
  .rulesbox { position: absolute; top: 10px; right: 10px; z-index: 5; max-width: min(380px, 90%); background: #0b0e12; border: 2px solid #f4f4ee; padding: 10px 14px; font-size: 14px; color: #e5ebe3; }
  .rulesbox h3 { margin: 0 0 6px; font-family: var(--f-display); font-size: 14px; }
  .rulesbox ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
  @media (max-width: 640px) {
    .who-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tray-grid { grid-template-columns: minmax(0, 1fr); }
    .dlg { grid-template-columns: 44px minmax(0, 1fr); } .dlg .face { width: 44px; height: 44px; }
    .dlg-text { font-size: 18px; }
    .sb-gauges { margin-left: 0; }
    .ov { position: static; padding: 8px; }
  }
  /* Franja de ambiente: grada y jugadores, separada de los árbitros */
  .ambient { list-style: none; margin: 0; padding: 8px 12px; background: #0b1013; border: 1px solid var(--line); display: grid; gap: 2px;
    font-family: var(--f-mono); font-size: 17px; line-height: 1.15; min-height: calc(3 * 1.15em + 16px); }
  .ambient li { opacity: .55; }
  .ambient li.now { opacity: 1; font-size: 20px; }
  .ambient .info { color: var(--muted); } .ambient .crowd { color: var(--sur); } .ambient .warn { color: var(--bad); } .ambient .you { color: var(--good); }
  /* Acta de la jugada: papel, como la carta del comité */
  .acta { background: #e9e4d6; color: #1f1c16; padding: 16px 18px; display: grid; gap: 12px; box-shadow: 0 3px 0 #a79f8a; }
  .acta-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #1f1c16; padding-bottom: 6px; }
  .acta-head span { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: #6d6555; font-weight: 600; }
  .acta-head b { font-family: var(--f-display); font-size: 22px; }
  .acta-lead { font-family: var(--f-display); font-size: 19px; line-height: 1.2; margin: 0; }
  .acta-hint { font-size: 14px; color: #6d6555; margin: 0; }
  .acta-actions, .consult, .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts { flex-direction: column; }
  ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: st; }
  ol.steps > li { counter-increment: st; display: grid; gap: 6px; }
  ol.steps h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: #4d473b; display: flex; gap: 8px; align-items: center; }
  ol.steps h3::before { content: counter(st); display: inline-grid; place-items: center; width: 20px; height: 20px; background: #1f1c16; color: #e9e4d6; font-family: var(--f-mono); font-size: 16px; }
  ol.steps p { margin: 0; font-size: 16px; }
  .pbtn { font: inherit; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; background: #f6f2e7; color: #1f1c16; border: 1px solid #b8b09a; padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
  .pbtn:hover:not(:disabled) { border-color: #1f1c16; }
  .pbtn:disabled { opacity: .45; cursor: default; }
  .pbtn:focus-visible { outline: 2px solid #1f1c16; outline-offset: 2px; }
  .pbtn.primary { background: var(--amber); border-color: #b07800; justify-self: start; }
  .pbtn.var { border-color: #b07800; color: #6e4a00; }
  .pbtn.src { border-left-width: 5px; }

  // Estadio nocturno pixelado detrás del menú
  function stadium() {
    const cv = $("#bg");
    if (!cv) return;
    const ctx = cv.getContext("2d"), w = 320, h = 180;
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const crowd = [];
    for (let y = 58; y < 104; y += 4) for (let x = 0; x < w; x += 3) crowd.push([x + rnd() * 2, y + rnd() * 2, rnd()]);
    const towers = [22, 108, 212, 298];
    const frame = n => {
      const g = ctx.createLinearGradient(0, 0, 0, 60);
      g.addColorStop(0, "#070a0f"); g.addColorStop(1, "#141d28");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      // haces de luz
      for (const x of towers) {
        ctx.fillStyle = "rgba(255,236,190,.05)";
        ctx.beginPath(); ctx.moveTo(x - 6, 20); ctx.lineTo(x + 6, 20); ctx.lineTo(x + 60, 150); ctx.lineTo(x - 60, 150); ctx.fill();
      }
      // grada
      ctx.fillStyle = "#101820"; ctx.fillRect(0, 54, w, 52);
      for (const [x, y, r] of crowd) {
        const flash = !RM && ((r * 997 + n * 0.37) % 1) < 0.004;
        ctx.fillStyle = flash ? "#ffffff" : r < 0.45 ? "#2c4a63" : r < 0.8 ? "#5a3a33" : "#39444f";
        ctx.fillRect(x, y, flash ? 2 : 1, flash ? 2 : 1);
      }
      // torres de focos
      for (const x of towers) {
        ctx.fillStyle = "#1c2630"; ctx.fillRect(x - 1, 20, 2, 36);
        ctx.fillStyle = "#fff4d6"; ctx.fillRect(x - 7, 14, 14, 6);
        ctx.fillStyle = "rgba(255,244,214,.18)"; ctx.fillRect(x - 10, 11, 20, 12);
      }
      // vallas publicitarias
      for (let x = 0; x < w; x += 32) { ctx.fillStyle = (x / 32) % 2 ? "#243b56" : "#8a6a24"; ctx.fillRect(x, 104, 32, 5); }
      // césped
      for (let i = 0; i < 16; i++) { ctx.fillStyle = i % 2 ? "#23502f" : "#275a35"; ctx.fillRect(i * 20, 109, 20, h - 109); }
      ctx.fillStyle = "rgba(223,232,216,.7)";
      ctx.fillRect(0, 140, w, 1); // línea de medio campo (en perspectiva)
      ctx.strokeStyle = "rgba(223,232,216,.7)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(160, 140.5, 44, 12, 0, 0, 7); ctx.stroke();
      // el árbitro, solo en el círculo central
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(157, 147, 8, 2);
      ctx.fillStyle = "#0b0b0b"; ctx.fillRect(158, 136, 5, 7);
      ctx.fillStyle = "#1a1a1a"; ctx.fillRect(158, 143, 2, 5); ctx.fillRect(161, 143, 2, 5);
      ctx.fillStyle = "#e3c9a8"; ctx.fillRect(159, 132, 3, 4);
      ctx.fillStyle = "#f0b43c"; ctx.fillRect(163, 138, 1, 1); // silbato
    };
    let n = 0, last = 0;
    const loop = now => {
      if (now - last > 120) { frame(n++); last = now; }
      view.bg = requestAnimationFrame(loop);
    };
    frame(0);
    if (!RM) view.bg = requestAnimationFrame(loop);
  }

  // ---------- Jugada ----------
  function startIncident() {
    const inc = INCIDENTS[state.idx];

  const RULES_LIST = `

  function renderIncident() {
    const inc = INCIDENTS[state.idx], c = state.cur;
    screen.innerHTML = `
      <section class="stage">

                <button class="btn sm" data-cam="contra">Contracampo</button>

                <button class="btn sm" data-cam="cenital">Cenital</button>
              </span>
            </div>
          </div>
        </div>
        <aside class="side">
          <div class="case">

    renderLog();
    renderDecide();
    wireVar();

  function renderLog() {
    save();
    const el = $("#log");
    if (!el) return;
    el.innerHTML = state.log.map(([who, txt]) => `<li><span class="who ${who.split(" ")[0].replace("Ú", "U").replace("É", "E")}">${esc(who)}</span><span>${esc(txt)}</span></li>`).join("");
    el.scrollTop = el.scrollHeight;
  }
  function say(who, txt) { state.log.push([who, txt]); renderLog(); }

  function renderDecide() {
    const inc = INCIDENTS[state.idx], c = state.cur, el = $("#decide");
    if (c.decided !== null) {
      const last = state.idx === INCIDENTS.length - 1;
      el.innerHTML = `<button class="btn primary" id="next">${last ? "Ver el informe del comité →" : state.idx === HALF_AFTER ? "Ir al descanso →" : "Siguiente jugada →"}</button>`;
      $("#next").onclick = nextStep;
      return;
    }
    el.innerHTML = `
      <h3>Tu decisión</h3>
      ${inc.options.map((o, i) => `<button class="btn opt" data-opt="${i}" ${c.watched ? "" : "disabled"}><span class="card ${o.card}"></span>${esc(o.label)}</button>`).join("")}
      ${c.varOpen ? `<p class="hint">Estás revisando en el VAR. Decide cuando lo tengas claro.</p>` :
        `<button class="btn var" id="varBtn" ${c.watched && state.varLeft > 0 ? "" : "disabled"}>Pedir VAR (quedan ${state.varLeft})</button>`}
      ${c.watched ? "" : `<p class="hint">Primero mira la jugada.</p>`}`;
    el.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => decide(+b.dataset.opt));
    const vb = $("#varBtn");
    if (vb) vb.onclick = openVar;
  }

  function playLive() {
    const pb = $("#playBtn");
    if (pb) pb.remove();
    const t0 = performance.now();
    const step = now => {
      view.t = clamp((now - t0) / LIVE_MS, 0, 1);
      draw();
      if (view.t < 1) view.anim = requestAnimationFrame(step);
      else finishLive();
    };
    view.anim = requestAnimationFrame(step);
  }

  function finishLive() {
    const inc = INCIDENTS[state.idx];
    state.cur.watched = true;
    const msgs = [...inc.post, inc.varHint];
    let i = 0;
    const next = () => {
      if (i >= msgs.length) return;
      say(...msgs[i++]);
      if (i < msgs.length) setTimeout(next, RM ? 0 : 700);
    };
    next();
    renderDecide();
  }

  function openVar() {
    if (state.varLeft <= 0) return;
    state.varLeft--;
    state.extra += 2;
    state.pressure = clamp(state.pressure + 8, 0, 100);
    state.cur.varOpen = true;
    view.t = 0;
    say("TÚ", "Me voy a la pantalla. Revisión VAR.");
    say("GRADA", "Uuuuuh... (la grada se impacienta)");
    renderHud();
    $("#monitor").classList.add("var");
    $("#tag").textContent = "VAR · REVISIÓN";
    $("#varbar").hidden = false;
    renderDecide();
    draw();
  }

  function wireVar() {
    const scrub = $("#scrub");
    if (!scrub) return;
    const set = t => { stopSlow(); view.t = clamp(t, 0, 1); draw(); };
    scrub.oninput = () => set(scrub.value / 1000);
    $("#fb").onclick = () => set(view.t - 0.01);
    $("#ff").onclick = () => set(view.t + 0.01);
    document.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => set(+b.dataset.jump));
    const toggle = (id, key) => { const b = $(id); b.onclick = () => { view[key] = !view[key]; draw(); }; };
    toggle("#zoom", "zoom");
    toggle("#line", "line");
    document.querySelectorAll("[data-cam]").forEach(b => b.onclick = () => { view.cam = b.dataset.cam; draw(); });
    $("#slow").onclick = () => {
      if (view.slowing) { stopSlow(); return; }
      if (view.t >= 1) view.t = 0;
      view.slowing = true;
      $("#slow").setAttribute("aria-pressed", "true");
      let last = performance.now();
      const step = now => {
        view.t = clamp(view.t + (now - last) / (LIVE_MS * 4), 0, 1);
        last = now;
        draw();
        if (view.t < 1 && view.slowing) view.anim = requestAnimationFrame(step);
        else stopSlow();
      };
      view.anim = requestAnimationFrame(step);
    };
  }
  function stopSlow() {
    view.slowing = false;
    cancelAnimationFrame(view.anim);
    const b = $("#slow");
    if (b) b.setAttribute("aria-pressed", "false");
  }

  function decide(i) {
    const inc = INCIDENTS[state.idx], o = inc.options[i];
    stopSlow();
    state.cur.decided = i;
    state.decisions[state.idx] = i;
    state.pressure = clamp(state.pressure + o.pressure, 0, 100);
    state.rep = clamp(state.rep + (o.grade === "correct" ? 10 : o.grade === "partial" ? 3 : -10), 0, 100);
    if (o.goal) state.score[o.goal]++;
    say("TÚ", o.label + ".");
    say("GRADA", o.crowd);
    if (state.pressure >= 80) say("GRADA", "El ambiente es irrespirable. El delegado pide calma por megafonía.");
    renderHud();
    renderDecide();
  }

  function nextStep() {
    if (state.mode === "story" && state.idx === HALF_AFTER && state.screen === "incident") { state.screen = "half"; render(); return; }
    state.extra = 0;
    if (state.idx >= INCIDENTS.length - 1) { state.screen = "report"; render(); return; }
    state.idx++;
    state.screen = "incident";
    startIncident();
  }

  // ---------- Partido rápido: pantalla de juego ----------
  // Todo pasa dentro de la imagen: marcador arriba, vista del partido, cajas de diálogo con los
  // árbitros y bandeja de decisiones con iconos. Sin paneles laterales.
  // Fases: intro → playing → deliberate → (whistled | goal | varcall | flow) → decided
  // Pasos al pitar: seen (lo que viste) → consult (a quién preguntas) → decide (qué pitas); var = monitor
  const METERS = [
    ["comite", "Comité", "confianza en ti", "var(--good)"],
    ["local", "Grada local", "enfado", "var(--sur)"],
    ["visit", "Visitantes", "enfado", "var(--norte)"],
    ["temp", "Temperatura", "de los jugadores", "var(--amber)"]
  ];
  const GAME_OVER = {
    local: ["INVASIÓN DE CAMPO", "La grada local invadió el campo. El partido se suspende y tú sales escoltado por la policía."],
    visit: ["RETIRADA DEL VISITANTE", "El equipo visitante se retiró del campo en protesta. Partido suspendido."],
    temp: ["TÁNGANA", "Los jugadores se lían a golpes en una tángana general. Partido suspendido."],
    comite: ["RELEVADO", "El delegado del comité te releva al descanso. No vuelves a salir al campo."]
  };
  const SOURCES = [["asistente", "Asistente"], ["cuarto", "Cuarto árbitro"], ["var", "Sala VAR"]];
  const PEOPLE = {
    tu: { name: "Tú", bg: "#1f4428", skin: "#d9a77e", hair: "#35241a", prop: "whistle" },
    asistente: { name: "Asistente", bg: "#1f3470", skin: "#e2b48a", hair: "#5a3a24", prop: "flag" },
    cuarto: { name: "Cuarto árbitro", bg: "#4a2f6e", skin: "#a8744e", hair: "#0b0e12", prop: "board" },
    var: { name: "Sala VAR", bg: "#5a3a24", skin: "#f0cfa6", hair: "#8a98a4", prop: "headset" },
    delegado: { name: "Delegado del comité", bg: "#2a323d", skin: "#d9a77e", hair: "#c8d0d6", prop: "tie" }
  };

  // Retrato pixelado de 16x16
  function drawFace(cv, who) {
    const P = PEOPLE[who], g = cv.getContext("2d"), px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
    px(0, 0, 16, 16, P.bg);
    px(2, 12, 12, 4, "#0b0e12");                      // camiseta negra de árbitro
    px(6, 12, 4, 1, "#f4f4ee");                       // cuello
    px(6, 10, 4, 2, P.skin);                          // cuello
    px(4, 3, 8, 8, P.skin);                           // cara
    px(4, 2, 8, 2, P.hair); px(3, 3, 1, 4, P.hair); px(12, 3, 1, 4, P.hair);
    px(6, 6, 1, 1, "#0b0e12"); px(9, 6, 1, 1, "#0b0e12");
    px(7, 9, 2, 1, "#8e1418");
    if (P.prop === "flag") { px(13, 2, 1, 9, "#c8d0d6"); px(14, 2, 2, 2, "#f2c81c"); px(14, 4, 2, 2, "#d8232a"); }
    if (P.prop === "board") { px(11, 8, 5, 4, "#1a1f27"); px(12, 9, 1, 2, "#ff5a4a"); px(14, 9, 1, 2, "#5ad07a"); }
    if (P.prop === "headset") { px(3, 2, 10, 1, "#1a1f27"); px(2, 5, 2, 3, "#1a1f27"); px(12, 5, 2, 3, "#1a1f27"); px(10, 8, 3, 1, "#1a1f27"); }
    if (P.prop === "whistle") { px(9, 9, 3, 1, "#c8d0d6"); px(4, 11, 1, 2, "#d8232a"); }
    if (P.prop === "tie") { px(7, 12, 2, 4, "#8e1418"); px(2, 12, 4, 4, "#3d4854"); px(10, 12, 4, 4, "#3d4854"); }
  }
  function paintFaces(root) { root.querySelectorAll("canvas[data-face]").forEach(c => drawFace(c, c.dataset.face)); }
  // Texto que aparece letra a letra, como en los juegos de la época
  function typeText(root) {
    root.querySelectorAll("[data-type]").forEach(el => {
      const full = el.dataset.type;
      if (RM) { el.textContent = full; return; }
      let i = 0;
      el.textContent = "";
      const step = () => { i += 2; el.textContent = full.slice(0, i); if (i < full.length) view.typer = setTimeout(step, 18); };
      clearTimeout(view.typer);
      step();
    });
  }
  const face = (who, cls = "face") => `<canvas class="${cls}" data-face="${who}" width="16" height="16" aria-hidden="true"></canvas>`;
  const dialog = (who, text, actions = "") => `
    <div class="dlg">
      ${face(who)}
      <div class="dlg-body"><b class="dlg-who">${esc(PEOPLE[who].name)}</b><p class="dlg-text" data-type="${esc(text)}"></p>${actions ? `<div class="dlg-actions">${actions}</div>` : ""}</div>
    </div>`;

  // Iconos de cada decisión, para distinguirlas de un vistazo
  function optIcons(o) {
    const cards = [].concat(o.cardTo || []), L = o.label;
    const ic = [];
    if (/^Penalti/.test(L)) ic.push("pen");
    if (/fuera de juego/i.test(L)) ic.push("flag");
    else if (/^Anular/.test(L)) ic.push("no");
    if (o.goal && /^Gol/.test(L)) ic.push("goal");
    if (/^Falta/.test(L) && !cards.length) ic.push("foul");
    cards.forEach(k => ic.push(k.kind === "R" ? "r" : "y"));
    if (o.noFoul || /^Nada|^No es gol|^Reanudar/.test(L)) ic.push("go");
    if (!ic.length) ic.push("foul");
    return ic.map(k => `<i class="ic ic-${k}"></i>`).join("");
  }

  function newCur() { return { phase: "intro", step: null, varOpen: false, whistled: false, whistleT: null, opts: null, notes: [], asked: {}, said: null }; }

  function amb(txt, tone = "info") {
    state.amb = (state.amb || []).concat([[tone, txt]]).slice(-6);
    renderAmbient();
  }
  function renderAmbient() {
    const el = $("#ambient");
    if (!el) return;

    el.className = "ticker " + (last ? last[0] : "");

  }

  function startQuickMatch() {
    KIT = teamsOf(state).kits;
    state.clips = [generateClip(state, 0)];
    INCIDENTS = state.clips;
    state.idx = 0; state.cur = newCur();
    state.amb = [];
    state.screen = "match";

    amb("Empieza el partido. El estadio está lleno.");

  // Marcador fino: resultado, minuto, grada, temperatura, tarjetas y VAR. La confianza del comité no se ve.
  function renderScore() {
    const el = $("#scorebar");
    if (!el) return;
    const tm = teamsOf(state), inc = INCIDENTS[state.idx], m = state.meters;
    const chip = k => { const sh = tm.kits[k].shirt; return `<span class="t" style="background:${sh};color:${["W", "Y", "S"].includes(FAM[sh]) || sh === "#f07a5a" ? "#0b0e12" : "#f4f4ee"}">${esc(tm[k][1])}</span>`; };
    const gauge = (label, v) => `<div class="gauge ${v >= 80 ? "hot2" : v >= 60 ? "hot1" : ""}" title="${label}: ${v}"><span>${label}</span><b class="trk"><i style="width:${clamp(v, 0, 100)}%"></i></b></div>`;
    const cards = Object.entries(state.cards).filter(([, n]) => n > 0);
    el.innerHTML = `
      <div class="sb-score">${chip("N")}<b>${state.score.N}</b><em>–</em><b>${state.score.S}</b>${chip("S")}</div>
      <div class="sb-min">${inc.minute}'</div>
      <div class="sb-gauges">${gauge("Grada local", m.local)}${gauge("Visitantes", m.visit)}${gauge("Temperatura", m.temp)}</div>
      <div class="sb-cards" title="Tarjetas">${cards.length ? cards.map(([id, n]) => `<span class="mini ${n >= 2 ? "r" : "y"}">${esc(tm[id[0]][1])} ${esc(id.slice(1) === "1" ? "POR" : id.slice(1))}</span>`).join("") : `<span class="none">Sin tarjetas</span>`}</div>
      <div class="sb-var">VAR ${[0, 1, 2].map(i => `<i class="pip ${i < state.varLeft ? "on" : ""}"></i>`).join("")}</div>
      <button class="sb-rules" id="rulesBtn" aria-expanded="false">Reglas</button>`;
    $("#rulesBtn").onclick = () => { const r = $("#rulesBox"); r.hidden = !r.hidden; };
  }

  function renderMatch() {
    const inc = INCIDENTS[state.idx], c = state.cur;
    c.notes = c.notes || []; c.asked = c.asked || {};
    if (c.phase === "playing") c.phase = "intro"; // una jugada a medias al volver: se ve desde el principio
    if ((c.phase === "whistled" || c.phase === "goal") && !c.step) c.step = "seen";
    screen.innerHTML = `
      <section class="game">
        <div class="scorebar" id="scorebar"></div>
        <div class="view ${c.varOpen ? "var" : ""}" id="monitor">
          <canvas id="cv" width="${CW}" height="${CH}" aria-label="Vista de la jugada"></canvas>
          <div class="tag" id="tag">${c.varOpen ? "VAR · REVISIÓN" : "● EN DIRECTO"}</div>
          <div class="ticker" id="ambient" aria-live="polite"></div>
          <div class="tc" id="tc"></div>
          ${c.phase === "intro" ? `<button class="playover" id="playBtn">${state.idx === 0 ? "▶ Empezar el partido" : "▶ Minuto " + inc.minute + "'"}</button>` : ""}
          <div class="ask" id="ask" hidden>¿PITAS?<b id="askN"></b></div>
          <div class="ov" id="ov"></div>
          <button class="whistle-fab" id="whistle" ${["intro", "playing", "deliberate"].includes(c.phase) ? "" : "hidden"}>¡PITAR!<small id="wsub">espacio</small></button>
          <div class="rulesbox" id="rulesBox" hidden>${RULES_LIST}</div>
        </div>
      </section>`;
    renderScore();
    renderAmbient();
    renderMatchPanel();
    $("#whistle").onclick = () => { if (state.cur.phase === "intro") playClip(); else whistle(); };
    const pb = $("#playBtn");
    if (pb) pb.onclick = playClip;
    view.t = c.whistled ? c.whistleT : c.phase === "intro" ? 0 : 1;
    if (c.varOpen) view.t = view.varT ?? 0;
    draw();
    if (c.phase === "deliberate") startDeliberation();
    if (c.phase === "intro" && state.idx > 0 && !c.autoStarted) {
      c.autoStarted = true;
      clearTimeout(view.auto);
      view.auto = setTimeout(() => { if (state.screen === "match" && state.cur.phase === "intro") playClip(); }, RM ? 1400 : 1100);
    }
  }
  function renderCards() { renderScore(); }

  function optsList() {
    const inc = INCIDENTS[state.idx], c = state.cur;
    return c.opts === "end" ? inc.endOpts : (inc.wOpts || inc.endOpts);
  }

  // Respuesta del cuarto árbitro: ve bien lo que pasa cerca de los banquillos, peor lo de las áreas
  function fourthSays(inc) {
    const good = ["offball", "theatre", "tackle", "keeper", "filler"].includes(inc.type) ? 0.7 : 0.4, x = Math.random();
    const t = inc.truth.charAt(0).toLowerCase() + inc.truth.slice(1);
    if (x < good) return inc.infraction ? `Yo lo he visto claro: ${t}.` : "Para mí no había nada.";
    if (x < good + 0.25) return inc.infraction ? "Para mí no había nada." : "Yo creo que ahí hay algo.";
    return "Desde el banquillo no lo he visto bien.";
  }

  function consult(src) {
    const c = state.cur, inc = INCIDENTS[state.idx];
    if (!c.asked[src]) {
      c.asked[src] = true;
      const txt = src === "asistente" ? inc.hint[1] : src === "var" ? inc.varHint[1] : fourthSays(inc);
      c.notes.push([src, txt]);
      bump("local", 2); bump("visit", 2);
      if (Object.keys(c.asked).length === 2) amb("La grada pita mientras hablas con tus compañeros.", "crowd");
      renderScore();
    }
    c.said = src;
    renderMatchPanel();
  }

  // Todo lo que se superpone a la imagen, según la fase y el paso
  function renderMatchPanel() {
    save();
    const c = state.cur, ov = $("#ov"), inc = INCIDENTS[state.idx];
    if (!ov) return;
    const wb = $("#whistle");
    if (wb) wb.hidden = !["intro", "playing", "deliberate"].includes(c.phase);
    let html = "";
    if (c.phase === "deliberate") {
      html = `<button class="pill" id="letPlay">Dejar seguir ▸</button>`;
    } else if (c.phase === "varcall") {
      html = dialog("var", "¡Espera! Revisa la jugada, puede haber algo.",
        `${state.varLeft > 0 ? `<button class="pill amber" id="goVar">Ir al monitor (${state.varLeft})</button>` : ""}<button class="pill" id="keepPlay">Mantener: sigue el juego</button>`);
    } else if (c.phase === "whistled" || c.phase === "goal") {
      if (c.step === "seen") {
        const lead = c.phase === "goal" ? (inc.question === "¿Vale el gol?" || !inc.question ? "¡Gol! Pero antes, lo que he visto: " : "") : "";
        html = dialog("tu", lead + (inc.seen || inc.title), `<button class="pill" id="toConsult">Consultar ▸</button><button class="pill ghost" id="toDecide">Decidir ya ▸</button>`);
      } else if (c.step === "consult") {
        const said = c.said && c.notes.find(n => n[0] === c.said);
        html = `
          <div class="panel">
            <p class="panel-title">¿A quién consultas?</p>
            <div class="who-row">
              ${SOURCES.map(([k, l]) => `<button class="who ${c.asked[k] ? "done" : ""} ${c.said === k ? "sel" : ""}" data-src="${k}">${face(k, "wface")}<span>${l}</span></button>`).join("")}
              <button class="who tv" id="varBtn" ${state.varLeft > 0 ? "" : "disabled"}><span class="tvicon"></span><span>Monitor VAR (${state.varLeft})</span></button>
            </div>
            <p class="panel-hint">Cada consulta hace esperar a la grada.</p>
          </div>
          ${said ? dialog(said[0], said[1], `<button class="pill" id="toDecide">Decidir ▸</button>`) : `<div class="dlg-row"><button class="pill" id="toDecide">Decidir ▸</button></div>`}`;
      } else if (c.step === "decide") {
        html = `
          <div class="panel tray">
            <p class="panel-title">${c.phase === "goal" ? (inc.question || "¿Vale el gol?") : "¿Qué pitas?"}</p>
            <div class="tray-grid">${optsList().map((o, i) => `<button class="opt-tile" data-opt="${i}"><span class="icons">${optIcons(o)}</span><span>${esc(o.label)}</span></button>`).join("")}</div>
            <button class="pill ghost small" id="backConsult">‹ Volver a consultar</button>
          </div>`;
      } else if (c.step === "var") {
        html = `
          <div class="varpanel" id="varbar">
            <div class="row">
              <button class="btn sm" id="fb" aria-label="Frame anterior">◀</button>
              <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Línea de tiempo">
              <button class="btn sm" id="ff" aria-label="Frame siguiente">▶</button>
              <button class="btn sm" id="slow">Lenta</button>
              <button class="btn sm" id="zoom" aria-pressed="false">Zoom</button>
              <button class="btn sm" id="line" aria-pressed="false">Línea</button>
            </div>
            <div class="row">
              ${inc.events.map(([t, l]) => `<button class="btn sm" data-jump="${t}">${l}</button>`).join("")}
              <span class="seg">${[["tribuna", "Tribuna"], ["porteria", "Portería"], ["contra", "Contra"], ["linea", "Línea gol"], ["cenital", "Cenital"]].map(([k, l]) => `<button class="btn sm" data-cam="${k}">${l}</button>`).join("")}</span>
              <button class="pill amber" id="endVar">Terminar revisión ▸</button>
            </div>
          </div>`;
      }
    } else if (c.phase === "decided") {
      const last = state.idx >= CLIPS_PER_MATCH - 1 || state.over;
      const d = state.decisions[state.decisions.length - 1];
      const crowd = (state.amb || []).slice(-1)[0];
      html = `
        <div class="verdict">
          <p class="v-label">${esc(d ? d.label : "")}</p>
          ${crowd ? `<p class="v-crowd ${crowd[0]}">${esc(crowd[1])}</p>` : ""}
          <button class="pill" id="next">${last ? "Ver el informe del comité ▸" : "Reanudar el partido ▸"}</button>
        </div>`;
    }
    ov.innerHTML = html;
    ov.className = "ov" + (c.step === "var" && (c.phase === "whistled" || c.phase === "goal") ? " bottom" : "");
    paintFaces(ov);
    typeText(ov);
    const on = (id, fn) => { const b = $("#" + id); if (b) b.onclick = fn; };
    on("letPlay", endDeliberation);
    on("goVar", () => { c.opts = inc.wOpts ? "w" : "end"; c.phase = "whistled"; openVarQ(); });
    on("keepPlay", () => applyOutcome({ label: "Sin pitar", ...inc.noWhistle }, "Mantienes tu decisión: sigue el juego."));
    on("toConsult", () => { c.step = "consult"; renderMatchPanel(); });
    on("toDecide", () => { c.step = "decide"; renderMatchPanel(); });
    on("backConsult", () => { c.step = c.varOpen ? "var" : "consult"; renderMatchPanel(); if (c.varOpen) wireVar(); });
    on("varBtn", openVarQ);
    on("endVar", () => { view.varT = view.t; stopSlow(); c.step = "decide"; renderMatchPanel(); });
    on("next", nextClip);
    ov.querySelectorAll("[data-src]").forEach(b => b.onclick = () => consult(b.dataset.src));
    ov.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => applyOutcome(optsList()[+b.dataset.opt]));
    if (c.step === "var") { wireVar(); draw(); }
  }

  // Momento clave de la jugada: ahí va la cámara lenta y hacia ahí mira tu vista
  const KEY_LABELS = new Set(["Entrada", "Impacto", "Remate", "Contacto", "Choque", "Bote", "Control", "En la línea", "Pase", "Jugada previa"]);
  const keyTime = inc => inc.keyT ?? (inc.events.find(e => KEY_LABELS.has(e[1])) || [0.5])[0];

  function playClip() {
    const c = state.cur;
    if (c.phase !== "intro") return;
    clearTimeout(view.auto);
    c.phase = "playing";
    $("#playBtn")?.remove();
    renderMatchPanel();
    const inc = INCIDENTS[state.idx], kT = keyTime(inc);
    let last = performance.now();
    view.t = 0;
    const step = now => {
      if (state.cur.phase !== "playing") return;
      const slow = Math.abs(view.t - kT) < 0.07 ? 0.35 : 1; // cámara lenta en el momento clave
      view.t = clamp(view.t + (now - last) / LIVE_MS * slow, 0, 1);
      last = now;
      draw();
      if (view.t < 1) view.anim = requestAnimationFrame(step);
      else clipEnded();
    };
    view.anim = requestAnimationFrame(step);
  }

  function whistle() {
    const c = state.cur, inc = INCIDENTS[state.idx];
    if (c.phase !== "playing" && c.phase !== "deliberate") return;
    cancelAnimationFrame(view.anim);
    stopDeliberation();
    c.phase = "whistled"; c.step = "seen"; c.whistled = true; c.whistleT = view.t; c.opts = inc.wOpts ? "w" : "end";
    amb("¡Piiiii! Paras el juego.", "you");
    renderMatchPanel();
  }

  function clipEnded() {
    const c = state.cur, inc = INCIDENTS[state.idx];
    if (inc.goalClip) {
      c.phase = "goal"; c.step = "seen"; c.opts = "end";
      (inc.post || []).forEach(m => amb(m[1], "crowd"));
      renderMatchPanel();
      return;
    }
    startDeliberation();
  }

  const DELIB_MS = 4000;
  function startDeliberation() {
    const c = state.cur;
    c.phase = "deliberate";
    stopDeliberation();
    const end = performance.now() + DELIB_MS;
    const w = $("#whistle"), ask = $("#ask");
    w.hidden = false; w.classList.add("hot");
    ask.hidden = false;
    const tick = () => {
      const left = Math.max(0, Math.ceil((end - performance.now()) / 1000));
      $("#askN").textContent = left; $("#wsub").textContent = `${left} s`;
      if (left <= 0) endDeliberation();
    };
    tick();
    view.delib = setInterval(tick, 200);
    renderMatchPanel();
  }
  function stopDeliberation() {
    clearInterval(view.delib);
    const w = $("#whistle"), ask = $("#ask");
    if (w) { w.classList.remove("hot"); $("#wsub").textContent = "espacio"; }
    if (ask) ask.hidden = true;
  }
  function endDeliberation() {
    const c = state.cur, inc = INCIDENTS[state.idx];
    if (c.phase !== "deliberate") return;
    stopDeliberation();
    if (Math.random() < (inc.infraction ? (inc.severe ? 0.55 : 0.35) : 0.07)) {
      c.phase = "varcall";
      renderMatchPanel();
      return;
    }
    c.phase = "flow";
    applyOutcome({ label: "Sin pitar", ...inc.noWhistle }, null, true);
  }

  function openVarQ() {
    const c = state.cur;
    if (state.varLeft <= 0) return;
    if (!c.varOpen) {
      state.varLeft--;
      bump("local", 4); bump("visit", 4);
      amb("Te vas al monitor. La grada se impacienta.", "crowd");
    }
    c.varOpen = true; c.step = "var";
    view.varT = 0;
    renderHud();
    renderMatch();
  }

  function bump(k, d) { state.meters[k] = clamp(Math.round(state.meters[k] + d), 0, 100); }

  // Aplica una decisión (o no pitar): barras, tarjetas, goles, informe
  function applyOutcome(o, note, silent) {
    const c = state.cur, inc = INCIDENTS[state.idx], tm = teamsOf(state);
    stopSlow();
    const grade = o.noFoul && !c.whistled && inc.noWhistle ? inc.noWhistle.grade : o.grade;
    state.decisions.push({ minute: inc.minute, title: inc.title, label: o.label, grade, truth: inc.truth, why: inc.why, ref: inc.ref || null, whistled: c.whistled });
    bump("comite", grade === "correct" ? 7 : grade === "partial" ? 1 : -12);
    if (o.fav) {
      const fav = o.fav === "atk" ? inc.atk : inc.def;
      bump(fav === "N" ? "visit" : "local", o.mag);
      bump(fav === "N" ? "local" : "visit", -o.mag / 2);
    }
    bump("temp", 2);
    if (grade === "wrong" && inc.infraction) bump("temp", inc.severe ? 20 : 12);
    if (grade === "correct") bump("temp", o.cardTo ? -12 : inc.infraction ? -5 : 0);
    if (c.whistled && !inc.infraction) bump("temp", 3);
    if (silent) amb("Sigue, sigue.", "you");
    for (const ct of [].concat(o.cardTo || [])) {
      const id = ct.t + ct.n, had = state.cards[id] || 0, who = ct.n === 1 ? "portero" : ct.n;
      if (ct.kind === "R") { state.cards[id] = 2; amb(`Roja al ${who} del ${tm[ct.t][2]}. A la calle.`, "you"); }
      else if (had === 1) { state.cards[id] = 2; amb(`Segunda amarilla al ${who} del ${tm[ct.t][2]}: expulsado.`, "you"); }
      else { state.cards[id] = 1; }
    }
    if (o.goal) {
      state.score[inc.atk]++;
      bump(inc.atk === "N" ? "local" : "visit", -10);
    }
    if (!silent) {
      const fav = o.fav ? (o.fav === "atk" ? inc.atk : inc.def) : null;
      amb(o.goal ? (inc.atk === "N" ? `¡Gol del ${tm.N[2]}! La grada explota.` : `Gol del ${tm.S[2]}. Silencio en el estadio.`)
        : fav === "N" ? pickMsg(["La grada aplaude.", "Ovación en el estadio."]) : fav === "S" ? pickMsg(["Pitada monumental.", "Te llueven insultos.", "Lanzan un mechero al campo."]) : "El juego se reanuda.", "crowd");
    }
    if (state.meters.temp >= 70) amb("Los jugadores están muy calientes. Hay empujones en cada jugada.", "warn");
    if (state.meters.local >= 75) amb("La grada local está al borde. Vuelan objetos.", "warn");
    for (const k of ["local", "visit", "temp"]) if (state.meters[k] >= 100) state.over = k;
    if (state.meters.comite <= 0) state.over = "comite";
    renderScore();
    c.phase = "decided"; c.step = null;
    if (silent && !state.over) {
      clearTimeout(view.auto);
      view.auto = setTimeout(() => { if (state.screen === "match" && state.cur.phase === "decided") nextClip(); }, RM ? 900 : 700);
      renderMatchPanel();
      return;
    }
    if (state.over) amb(GAME_OVER[state.over][1], "warn");
    else if (state.meters.comite <= 25) amb("El delegado del comité toma notas en la grada. No parece contento.", "warn");
    renderMatchPanel();
  }
  const pickMsg = a => a[(Math.random() * a.length) | 0];

  function nextClip() {
    clearTimeout(view.auto);
    if (state.over || state.idx >= CLIPS_PER_MATCH - 1) { state.screen = "report"; render(); return; }
    state.idx++;
    state.clips[state.idx] = state.clips[state.idx] || generateClip(state, state.idx);
    INCIDENTS = state.clips;
    state.cur = newCur();
    state.extra = 0;
    Object.assign(view, { t: 0, cam: "tribuna", zoom: false, line: false, varT: 0 });
    render();
  }

  function renderReportQuick() {
    const tm = teamsOf(state), rows = state.decisions;
    const nC = rows.filter(r => r.grade === "correct").length, nP = rows.filter(r => r.grade === "partial").length;
    const ratio = rows.length ? (nC + nP * 0.5) / rows.length : 0;
    let stamp, cls, note;
    if (state.over) [stamp, cls, note] = [GAME_OVER[state.over][0], "bad", GAME_OVER[state.over][1]];
    else if (ratio >= 0.8) [stamp, cls, note] = ["APROBADO", "ok", "Gran partido. El comité toma nota."];
    else if (ratio >= 0.55) [stamp, cls, note] = ["APROBADO CON RESERVAS", "mid", "Actuación irregular. Hay que afinar el criterio."];
    else [stamp, cls, note] = ["SUSPENSO", "bad", "Demasiados errores. Te toca volver a ver vídeos."];
    const gradeTxt = { correct: "Correcta", partial: "Aceptable", wrong: "Error" };
    const m = state.meters;
    screen.innerHTML = `
      <section class="report">
        <div class="stamp ${cls}">${stamp}</div>
        <div class="rep-head">
          <p class="eyebrow">Comité de Árbitros · Informe de actuación</p>
          <h2>${esc(tm.N[0])} ${state.score.N} – ${state.score.S} ${esc(tm.S[0])}</h2>
        </div>
        <div class="tablewrap">
          <table>
            <thead><tr><th>Min.</th><th>Jugada</th><th>Tu decisión</th><th>Lo correcto</th><th>Resultado</th></tr></thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td class="num">${r.minute}'</td>
                  <td>${esc(r.title)}</td>
                  <td>${esc(r.label)}</td>
                  <td>${esc(r.truth)}<div class="why">${esc(r.why)}</div>${r.ref ? `<div class="caso">Caso real: ${esc(r.ref)}</div>` : ""}</td>
                  <td class="res ${r.grade}">${gradeTxt[r.grade]}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <p class="note"><b>Observaciones:</b> ${esc(note)}</p>
        <p class="note">Comité: <b>${m.comite}</b> · Grada local: <b>${m.local}</b> · Visitantes: <b>${m.visit}</b> · Temperatura: <b>${m.temp}</b> · VAR usado: <b>${3 - state.varLeft}</b> de 3</p>
        <div class="row">
          <button class="btn primary" id="again" style="color:#1a1305">Otro partido</button>
          <button class="btn" id="toMenu" style="color:#1f1c16;background:transparent;border-color:#8a826e">Menú</button>
        </div>
      </section>`;
    $("#again").onclick = startQuick;
    $("#toMenu").onclick = () => { clearSave(); state = fresh(); render(); };
  }

  // ---------- Descanso ----------
  function renderHalf() {
    save();
    const b = state.bribe;
    screen.innerHTML = `
      <section class="sheet">
        <p class="eyebrow">Descanso · Vestuario arbitral</p>
        <h2 class="title" style="font-size:clamp(26px,5vw,44px)">Un sobre en la taquilla</h2>
        <p class="lead">Encima de tu ropa hay un sobre que antes no estaba. Dentro hay <b>3 millones de forintos</b> en billetes y una nota:</p>
        <p class="lead" style="font-family:var(--f-mono);font-size:24px;color:var(--amber)">«Por un buen arbitraje en la segunda parte. Tus amigos de Kőhegy.»</p>
        ${b === null ? `
          <div class="row">
            <button class="btn" id="keep">Guardar el sobre en la mochila</button>
            <button class="btn" id="give">Entregarlo al delegado del partido</button>
          </div>` : `
          <p class="lead">${b === "keep" ? "Guardas el sobre. Nadie te ha visto. Eso crees." : "El delegado se lleva el sobre y toma nota. «Esto lo va a saber el comité», te dice."}</p>
          <button class="btn primary" id="cont">Salir a la segunda parte →</button>`}
      </section>`;
    if (b === null) {
      $("#keep").onclick = () => { state.bribe = "keep"; renderHalf(); };
      $("#give").onclick = () => { state.bribe = "give"; state.rep = clamp(state.rep + 5, 0, 100); renderHud(); renderHalf(); };
    } else {
      $("#cont").onclick = () => { state.idx++; state.screen = "incident"; startIncident(); };
    }
  }

  // ---------- Informe ----------
  function renderReport() {
    if (state.mode === "quick") return renderReportQuick();
    const PAY = { correct: 40000, partial: 10000, wrong: -50000 };
    const ft = v => Math.abs(v).toLocaleString("es-ES", { useGrouping: true }).replace(/,/g, ".") + " Ft";
    const rows = INCIDENTS.map((inc, i) => {
      const o = inc.options[state.decisions[i]];
      return { inc, o, grade: o.grade };
    });
    const count = g => rows.filter(r => r.grade === g).length;
    const nC = count("correct"), nP = count("partial"), nW = count("wrong");
    const kept = state.bribe === "keep";
    const favoredDozsa = rows[3] && rows[3].grade !== "correct";
    const fine = state.pressure >= 70 ? -30000 : 0;
    const lines = [
      [state.mode === "quick" ? "Honorarios del partido" : "Honorarios de la final", 180000],
      [`Bonificación por aciertos (${nC} × ${ft(PAY.correct)})`, nC * PAY.correct],
      ...(nP ? [[`Decisiones aceptables (${nP} × ${ft(PAY.partial)})`, nP * PAY.partial]] : []),
      ...(nW ? [[`Multas por errores (${nW} × ${ft(PAY.wrong)})`, nW * PAY.wrong]] : []),
      ...(fine ? [["Sanción por incidentes en la grada", fine]] : []),
      ...(kept ? [["Sobre sin remitente", 3000000]] : [])
    ];
    const total = lines.reduce((s, l) => s + l[1], 0);

    let stamp, cls, note;
    const quick = state.mode === "quick", tm = teamsOf(state);
    if (quick) {
      [stamp, cls, note] = nC >= 4 ? ["APROBADO", "ok", "Gran partido. El comité toma nota."]
        : nC >= 2 ? ["APROBADO CON RESERVAS", "mid", "Actuación irregular. Hay que afinar el criterio."]
          : ["SUSPENSO", "bad", "Demasiados errores. Te toca volver a ver vídeos."];
    } else if (kept && favoredDozsa) {
      stamp = "EXPEDIENTE ABIERTO"; cls = "bad";
      note = "Una denuncia anónima señala la entrada del minuto 63. Mañana tu nombre sale en la prensa deportiva.";
    } else if (nC >= 4) {
      stamp = "APROBADO"; cls = "ok";
      note = "Una final limpia. En la federación ya se habla de ti para el próximo torneo internacional.";
    } else if (nC >= 2) {
      stamp = "APROBADO CON RESERVAS"; cls = "mid";
      note = "La prensa critica tu arbitraje. Tu sitio en la lista internacional queda en el aire.";
    } else {
      stamp = "SUSPENSO"; cls = "bad";
      note = "Te retiran de la lista internacional. No es así como querías terminar.";
    }
    if (kept && !favoredDozsa) note += " En Kőhegy alguien está muy enfadado contigo. Y sabe dónde vives.";
    if (state.bribe === "give") note += " El comité agradece que entregaras el sobre. Hay quien dice que eso aquí no se hace.";

    const sign = v => (v > 0 ? "+" : v < 0 ? "−" : "") + ft(v);
    const gradeTxt = { correct: "Correcta", partial: "Aceptable", wrong: "Error" };
    screen.innerHTML = `
      <section class="report">
        <div class="stamp ${cls}">${stamp}</div>
        <div class="rep-head">
          <p class="eyebrow">Comité de Árbitros · Informe de actuación · Árbitro: ${esc(fullName(state.ref))}</p>
          <h2>${quick ? "Partido rápido" : "Final de Copa 2019"} · ${esc(tm.N[0])} ${state.score.N} – ${state.score.S} ${esc(tm.S[0])}</h2>
        </div>
        <div class="tablewrap">
          <table>
            <thead><tr><th>Min.</th><th>Jugada</th><th>Tu decisión</th><th>Lo correcto</th><th>Resultado</th></tr></thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td class="num">${r.inc.minute}'</td>
                  <td>${esc(r.inc.title)}</td>
                  <td>${esc(r.o.label)}</td>
                  <td>${esc(r.inc.truth)}<div class="why">${esc(r.inc.why)}</div></td>
                  <td class="res ${r.grade}">${gradeTxt[r.grade]}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <table class="pay">
          <tbody>
            ${lines.map(([l, v]) => `<tr><td>${esc(l)}</td><td class="num">${sign(v)}</td></tr>`).join("")}
            <tr class="total"><td>Total a cobrar</td><td class="num">${sign(total)}</td></tr>
          </tbody>
        </table>
        <p class="note"><b>Observaciones:</b> ${esc(note)}</p>
        <p class="note">Reputación final: <b>${state.rep}</b>/100 · Presión de grada final: <b>${state.pressure}</b>/100 · Revisiones VAR usadas: <b>${3 - state.varLeft}</b> de 3</p>
        <div class="row">
          <button class="btn primary" id="again" style="color:#1a1305">${quick ? "Otro partido" : "Continuar →"}</button>
          ${quick ? `<button class="btn" id="toMenu" style="color:#1f1c16;background:transparent;border-color:#8a826e">Menú</button>` : ""}
        </div>
      </section>`;
    $("#again").onclick = quick ? startQuick : () => { state.screen = "epilogue"; render(); };
    if (quick) $("#toMenu").onclick = () => { clearSave(); state = fresh(); render(); };
  }

  // ---------- Dibujo ----------
  // Mundo: x a lo largo del campo (portería en x=304), y a lo ancho, z altura. 1 unidad ≈ 18 cm.
  const CAMS = { ojos: "TU VISTA", tribuna: "CAM 1 · TRIBUNA", porteria: "CAM 2 · PORTERÍA", contra: "CAM 3 · CONTRACAMPO", linea: "CAM 5 · LÍNEA DE GOL", cenital: "CAM 4 · CENITAL" };

  const focusPos = (inc, t) => inc.focus === "ball" ? ballPos(inc, t) : at(inc.ents.find(e => e.id === inc.focus).k, t);
  const ballPos = (inc, t) => { const b = at(inc.ball, t); return { x: b.x, y: b.y, z: inc.ballZ ? at(inc.ballZ, t).x : 0 }; };
  const dorsal = e => e.gk ? "1" : e.id.replace(/\D/g, "");
  const teamColor = e => e.gk ? KIT[e.t].gk : KIT[e.t].shirt;

  function draw() {
    const cv = $("#cv");
    if (!cv) return;
    const ctx = cv.getContext("2d");
    const inc = INCIDENTS[state.idx], varOn = state.cur.varOpen;
    const cam = varOn ? view.cam : "ojos";
    const zoom = varOn && view.zoom, line = varOn && view.line;
    if (cam === "cenital") drawTop(ctx, inc, view.t, zoom, line);
    else draw3D(ctx, inc, view.t, cam, zoom, line, varOn);
    const tc = $("#tc");
    if (tc) tc.textContent = varOn ? `${CAMS[cam]}${zoom ? " · ZOOM" : ""} · ${(view.t * LIVE_MS / 1000).toFixed(2)}s` : `TU VISTA · ${inc.minute}'`;
    const scrub = $("#scrub");
    if (scrub) scrub.value = Math.round(view.t * 1000);
    const zb = $("#zoom"), lb = $("#line");
    if (zb) zb.setAttribute("aria-pressed", String(view.zoom));
    if (lb) lb.setAttribute("aria-pressed", String(view.line));
    document.querySelectorAll("[data-cam]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cam === cam)));
  }

  // Segundo defensor más adelantado (el portero cuenta), medido por la parte del cuerpo más adelantada
  function offsideX(inc, t) {
    const xs = inc.ents.filter(e => e.t === (inc.def || "S")).map(e => at(e.k, t).x + 1).sort((a, b) => b - a);
    return xs[1] ?? xs[0];
  }

  // ----- Cenital (pizarra) -----
  function drawPitch(ctx) {
    for (let i = 0; i < 17; i++) { ctx.fillStyle = i % 2 ? COL.pitch2 : COL.pitch; ctx.fillRect(i * 20, 0, 20, H); }
    ctx.strokeStyle = COL.chalk; ctx.lineWidth = 1;
    ctx.strokeRect(10.5, 6.5, 294, 188);
    ctx.strokeRect(256.5, 46.5, 48, 108);
    ctx.strokeRect(290.5, 74.5, 14, 52);
    ctx.fillStyle = COL.chalk; ctx.fillRect(272, 100, 1, 1);
    const a = Math.acos(-16 / 24);
    ctx.beginPath(); ctx.arc(272.5, 100.5, 24, a, 2 * Math.PI - a); ctx.stroke();
    ctx.beginPath(); ctx.arc(10.5, 100.5, 22, -Math.PI / 2, Math.PI / 2); ctx.stroke();
    ctx.fillStyle = "rgba(230,240,230,.25)"; ctx.fillRect(305, 90, 6, 20);
    ctx.fillStyle = COL.chalk; ctx.fillRect(304, 89, 7, 1); ctx.fillRect(304, 110, 7, 1);
  }

  function drawTop(ctx, inc, t, zoom, line) {
    const k = CW / W;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#08100b"; ctx.fillRect(0, 0, CW, CH);
    if (zoom) {
      const f = focusPos(inc, t), s = k * 3;
      ctx.setTransform(s, 0, 0, s, Math.round(CW / 2 - f.x * s), Math.round(CH / 2 - f.y * s));
    } else ctx.setTransform(k, 0, 0, k, 0, 0);
    drawPitch(ctx);
    if (line) {
      ctx.fillStyle = COL.amber;
      ctx.fillRect(offsideX(inc, t) - (zoom ? 0.15 : 0.35), 0, zoom ? 0.3 : 0.7, H);
    }
    for (const e of inc.ents) {
      const p = at(e.k, t);
      ctx.fillStyle = "rgba(0,0,0,.3)";
      ctx.beginPath(); ctx.ellipse(p.x + 1, p.y + 1.2, 3, 2, 0, 0, 7); ctx.fill();
      ctx.fillStyle = teamColor(e); ctx.strokeStyle = COL.dark; ctx.lineWidth = 0.6;
      ctx.beginPath();
      if (e.fall !== undefined && t >= e.fall) ctx.ellipse(p.x + 1, p.y, 4.6, 2.2, 0.35, 0, 7);
      else ctx.arc(p.x, p.y, 3, 0, 7);
      ctx.fill(); ctx.stroke();
      if (zoom) {
        ctx.fillStyle = COL.dark; ctx.font = "5px monospace"; ctx.textAlign = "center";
        ctx.fillText(dorsal(e), p.x, p.y + 1.7);
      }
    }
    const b = ballPos(inc, t);
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(b.x + 0.8 + b.z * 0.3, b.y + 0.8 + b.z * 0.3, 1.5, 0, 7); ctx.fill();
    ctx.fillStyle = COL.ball; ctx.strokeStyle = COL.dark; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, 1.6 + b.z * 0.05, 0, 7); ctx.fill(); ctx.stroke();
  }

  // ----- 3D: cámaras de televisión y tu vista -----
  // Estilo 16 bits: todo se dibuja a 320x200, píxel a píxel, y se amplía x2 sin suavizar.
  const LW = 213, LH = 133; // se amplía x3 exacto al lienzo de 639x399
  const V = {
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
  };
  const NEAR = 2;
  function makeCam(pos, tgt, f) {
    const fw = V.norm(V.sub(tgt, pos)), right = V.norm(V.cross([0, 0, 1], fw)), up = V.cross(fw, right);
    return { pos, fw, right, up, f };
  }
  const toCam = (c, p) => { const d = V.sub(p, c.pos); return [V.dot(d, c.right), V.dot(d, c.up), V.dot(d, c.fw)]; };
  const scr = (c, q) => [LW / 2 + c.f * q[0] / q[2], LH / 2 - c.f * q[1] / q[2]];
  function proj(c, p) {
    const q = toCam(c, p);
    if (q[2] < NEAR) return null;
    const [x, y] = scr(c, q);
    return { x, y, s: c.f / q[2], d: q[2] };
  }
  const mkBuf = () => { const b = document.createElement("canvas"); b.width = LW; b.height = LH; return b; };
  const LBUF = mkBuf(), SBUF = mkBuf();
  const LCTX = LBUF.getContext("2d", { willReadFrequently: true });

  // Paleta fija de 32 colores y tramado ordenado (Bayer 4x4), como en una consola de 16 bits
  const PALETTE = ["#0b0e12", "#1a1f27", "#2a323d", "#3d4854", "#5d6b78", "#8a98a4", "#c8d0d6", "#f4f4ee",
    "#16301e", "#1f4428", "#2a5c35", "#377444", "#4f9150", "#2b5f8a", "#3f86b8", "#7cc4f0",
    "#b8e2f8", "#6e2a1c", "#b8452b", "#f07a5a", "#f6b39a", "#5a3a24", "#a8744e", "#d9a77e",
    "#f0cfa6", "#35241a", "#8a6a14", "#d8a21c", "#f2d65c", "#4a2f6e", "#8e68c4", "#1f4e8c",
    "#ff5a4a", "#d8232a", "#8e1418", "#3a5aa8", "#1f3470", "#101c40", "#4a7ae0", "#1f4eb8", "#12307a",
    "#fff27a", "#f2c81c", "#a8860c", "#5ad07a", "#1f9a4a", "#0f5a2a"].map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const LUT = new Uint8Array(32768).fill(255);
  function nearestColor(r, g, b) {
    let best = 0, bd = Infinity;
    PALETTE.forEach(([pr, pg, pb], i) => { const d = 2 * (r - pr) ** 2 + 4 * (g - pg) ** 2 + 3 * (b - pb) ** 2; if (d < bd) { bd = d; best = i; } });
    return best;
  }
  const EXACT = new Map(PALETTE.map(([r, g, b], i) => [r << 16 | g << 8 | b, i]));
  function quantize(g) {
    const img = g.getImageData(0, 0, LW, LH), d = img.data;
    for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
      const i = (y * LW + x) * 4;
      if (EXACT.has(d[i] << 16 | d[i + 1] << 8 | d[i + 2])) { d[i + 3] = 255; continue; }
      const th = (BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.47) * 30;
      const r = clamp(d[i] + th, 0, 255) | 0, gg = clamp(d[i + 1] + th, 0, 255) | 0, b = clamp(d[i + 2] + th, 0, 255) | 0;
      const key = (r >> 3) << 10 | (gg >> 3) << 5 | (b >> 3);
      let k = LUT[key];
      if (k === 255) k = LUT[key] = nearestColor(r | 4, gg | 4, b | 4);
      const c = PALETTE[k];
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }

  // --- Primitivas de píxel (sin antialias) ---
  function clipSeg(x0, y0, x1, y1) {
    let t0 = 0, t1 = 1;
    const dx = x1 - x0, dy = y1 - y0, P = [-dx, dx, -dy, dy], Qv = [x0 + 4, LW + 4 - x0, y0 + 4, LH + 4 - y0];
    for (let i = 0; i < 4; i++) {
      if (P[i] === 0) { if (Qv[i] < 0) return null; continue; }
      const r = Qv[i] / P[i];
      if (P[i] < 0) { if (r > t1) return null; if (r > t0) t0 = r; }
      else { if (r < t0) return null; if (r < t1) t1 = r; }
    }
    return [x0 + t0 * dx, y0 + t0 * dy, x0 + t1 * dx, y0 + t1 * dy];
  }
  function pxLine(g, x0, y0, x1, y1, w, col) {
    const cl = clipSeg(x0, y0, x1, y1);
    if (!cl) return;
    [x0, y0, x1, y1] = cl.map(Math.round);
    g.fillStyle = col;
    const o = Math.floor((w - 1) / 2), dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (let n = 0; n < 1200; n++) {
      g.fillRect(x0 - o, y0 - o, w, w);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }
  function pxEllipse(g, cx, cy, rx, ry, col) {
    g.fillStyle = col; cx = Math.round(cx); cy = Math.round(cy);
    for (let dy = -ry; dy <= ry; dy++) { const h = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy / (ry + 0.5)) ** 2))); g.fillRect(cx - h, cy + dy, 2 * h + 1, 1); }
  }
  const pxDisc = (g, cx, cy, r, col) => pxEllipse(g, cx, cy, r, r, col);
  // Polígono convexo relleno por líneas de barrido
  function pxPoly(g, pts, col) {
    let y0 = Infinity, y1 = -Infinity;
    for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    y0 = Math.max(0, Math.floor(y0)); y1 = Math.min(LH - 1, Math.ceil(y1));
    g.fillStyle = col;
    for (let y = y0; y <= y1; y++) {
      const yc = y + 0.5;
      let lo = Infinity, hi = -Infinity;
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) {
          const x = a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0]);
          lo = Math.min(lo, x); hi = Math.max(hi, x);
        }
      }
      if (lo <= hi) { const xa = Math.max(0, Math.round(lo)), xb = Math.min(LW, Math.round(hi)); if (xb > xa) g.fillRect(xa, y, xb - xa, 1); }
    }
  }
  function poly3(g, c, pts, fill) {
    const qs = pts.map(p => toCam(c, p)), out = [];
    for (let i = 0; i < qs.length; i++) {
      const a = qs[i], b = qs[(i + 1) % qs.length], ai = a[2] >= NEAR, bi = b[2] >= NEAR;
      if (ai) out.push(a);
      if (ai !== bi) { const u = (NEAR - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, NEAR]); }
    }
    if (out.length >= 3) pxPoly(g, out.map(q => scr(c, q)), fill);
  }
  function seg3(g, c, a, b, w, col) {
    let qa = toCam(c, a), qb = toCam(c, b);
    if (qa[2] < NEAR && qb[2] < NEAR) return;
    if (qa[2] < NEAR || qb[2] < NEAR) {
      const u = (NEAR - qa[2]) / (qb[2] - qa[2]);
      const m = [qa[0] + (qb[0] - qa[0]) * u, qa[1] + (qb[1] - qa[1]) * u, NEAR];
      if (qa[2] < NEAR) qa = m; else qb = m;
    }
    const [x1, y1] = scr(c, qa), [x2, y2] = scr(c, qb);
    pxLine(g, x1, y1, x2, y2, w, col);
  }
  const DIGITS = { 0: "111101101101111", 1: "010110010010111", 2: "111001111100111", 3: "111001111001111", 4: "101101111001001",
    5: "111100111001111", 6: "111100111101111", 7: "111001001001001", 8: "111101111101111", 9: "111101111001111" };
  function pxNumber(g, str, cx, y, col) {
    const w = str.length * 4 - 1;
    let x = Math.round(cx - w / 2); y = Math.round(y);
    g.fillStyle = "#0b0e12"; g.fillRect(x - 1, y - 1, w + 2, 7);
    g.fillStyle = col;
    for (const ch of str) {
      const m = DIGITS[ch];
      if (m) for (let i = 0; i < 15; i++) if (m[i] === "1") g.fillRect(x + (i % 3), y + ((i / 3) | 0), 1, 1);
      x += 4;
    }
  }

  // --- Color: sombreado y bruma de distancia ---
  const HAZE = [30, 42, 52];
  const hexRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function tone(h, k, fog) {
    const c = hexRGB(h).map((v, i) => { const x = Math.min(255, v * k); return x + (HAZE[i] - x) * fog; });
    return `rgb(${c.map(Math.round).join(",")})`;
  }

  // --- Estadio ---
  const TOWERS = [[-330, -40, 150], [350, -40, 150], [-330, 240, 150], [350, 240, 150]];
  function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
  const patterns = {};
  function pattern(g, key, size, paint) {
    if (!patterns[key]) { const cv = document.createElement("canvas"); cv.width = cv.height = size; paint(cv.getContext("2d")); patterns[key] = g.createPattern(cv, "repeat"); }
    return patterns[key];
  }
  const crowdPat = g => pattern(g, "crowd", 32, x => {
    x.fillStyle = "#0b0e12"; x.fillRect(0, 0, 32, 32);
    const r = seeded(9), cols = ["#2a323d", "#3d4854", "#7cc4f0", "#3f86b8", "#6e2a1c", "#b8452b", "#c8d0d6", "#1a1f27"];
    for (let y = 0; y < 32; y += 2) for (let xx = (y / 2) % 2; xx < 32; xx += 2) { x.fillStyle = cols[(r() * cols.length) | 0]; x.fillRect(xx, y, 1, 1); }
  });
  const grassPat = g => pattern(g, "grass", 8, x => {
    const r = seeded(3);
    for (let y = 0; y < 8; y++) for (let xx = 0; xx < 8; xx++) { if (r() < 0.22) { x.fillStyle = r() < 0.5 ? "rgba(0,0,0,.18)" : "rgba(255,255,255,.07)"; x.fillRect(xx, y, 1, 1); } }
  });

  function drawStadium(g, c) {
    // cielo nocturno
    const sky = g.createLinearGradient(0, 0, 0, LH);
    sky.addColorStop(0, "#05080c"); sky.addColorStop(1, "#141d27");
    g.fillStyle = sky; g.fillRect(0, 0, LW, LH);
    // césped (campo completo, con la otra mitad) y franjas de corte
    poly3(g, c, [[-312, -12, 0], [332, -12, 0], [332, 212, 0], [-312, 212, 0]], "#2a5c35");
    for (let x = -312, i = 0; x < 332; x += 21.5, i++) if (i % 2) poly3(g, c, [[x, -12, 0], [x + 21.5, -12, 0], [x + 21.5, 212, 0], [x, 212, 0]], "#377444");
    poly3(g, c, [[-312, -12, 0], [332, -12, 0], [332, 212, 0], [-312, 212, 0]], grassPat(g));
    // gradas en los lados que la cámara tiene delante (las de detrás no se ven)
    const sides = [];
    const P = { N: (a, o, z) => [a, -12 - o, z], S: (a, o, z) => [a, 212 + o, z], W: (a, o, z) => [-312 - o, a, z], E: (a, o, z) => [332 + o, a, z] };
    if (c.pos[1] > -12) sides.push(["N", -400, 420, [10, -60]]);
    if (c.pos[1] < 212) sides.push(["S", -400, 420, [10, 260]]);
    if (c.pos[0] > -312) sides.push(["W", -100, 300, [-360, 100]]);
    if (c.pos[0] < 332) sides.push(["E", -100, 300, [380, 100]]);
    sides.sort((a, b) => Math.hypot(b[3][0] - c.pos[0], b[3][1] - c.pos[1]) - Math.hypot(a[3][0] - c.pos[0], a[3][1] - c.pos[1]));
    const crowd = crowdPat(g);
    for (const [k, a0, a1] of sides) {
      const f = P[k], step = (a1 - a0) / 8;
      for (let i = 0; i < 8; i++) {
        const a = a0 + i * step, b = a + step;
        poly3(g, c, [f(a, 0, 0), f(b, 0, 0), f(b, 0, 5), f(a, 0, 5)], "#1a1f27");              // muro
        poly3(g, c, [f(a, 1, 5), f(b, 1, 5), f(b, 66, 44), f(a, 66, 44)], crowd);                // grada
        poly3(g, c, [f(a, 66, 44), f(b, 66, 44), f(b, 66, 58), f(a, 66, 58)], "#0b0e12");        // fondo
        poly3(g, c, [f(a, 26, 58), f(b, 26, 58), f(b, 76, 64), f(a, 76, 64)], "#1a1f27");        // techo
        poly3(g, c, [f(a, 26, 55), f(b, 26, 55), f(b, 26, 58), f(a, 26, 58)], "#2a323d");        // borde del techo
      }
      for (let i = 0; i < 20; i++) {
        const a = a0 + i * (a1 - a0) / 20, b = a + (a1 - a0) / 20;
        poly3(g, c, [f(a, -3, 0), f(b, -3, 0), f(b, -3, 3.4), f(a, -3, 3.4)], i % 2 ? "#1f4e8c" : "#d8a21c"); // vallas
      }
    }
    // torres de focos
    for (const T of TOWERS) {
      seg3(g, c, [T[0], T[1], 0], T, 1, "#1a1f27");
      const q = proj(c, T);
      if (!q) continue;
      g.globalCompositeOperation = "lighter";
      pxDisc(g, q.x, q.y, 5, "rgba(255,236,190,.08)");
      pxDisc(g, q.x, q.y, 3, "rgba(255,236,190,.14)");
      g.globalCompositeOperation = "source-over";

  }

  function draw3D(ctx, inc, t, kind, zoom, line, labels) {

  function vel(k, t) {

  // Hacia dónde mira un jugador: hacia donde corre; si está quieto, al punto indicado o al balón.

  // Esqueleto en coordenadas locales [adelante, lado, altura]. Altura total ≈ 10 (1,80 m).

    const lean = running ? 0.55 : 0.08;

    const P = {
      pelvis: [0, 0, 5.0], neck: [lean, 0, 8.6], head: [lean + 0.12, 0, 9.4],
      footL: [sw * 1.9, 0.42, running ? Math.max(0, lift) * 0.9 : 0], footR: [-sw * 1.9, -0.42, running ? Math.max(0, -lift) * 0.9 : 0],

    P.waistL = add(along(0.22), [0, 0.68, 0]); P.waistR = add(along(0.22), [0, -0.68, 0]);
    P.shL = add(along(0.94), [0, 1.02, 0]); P.shR = add(along(0.94), [0, -1.02, 0]);

  // Altura del salto en cada momento
  function jumpLift(e, t) {
    const J = e.jump;

  // Cuerpo en coordenadas del mundo (sirve para dibujar el sprite y sus sombras)
  function bodyWorld(e, inc, t) {

    const P = bodyLocal(e, inc, t, F.sp, p, u, v);

    const lift = jumpLift(e, t);

  // Sombras: una por cada torre de focos (la cruz típica de los partidos de noche) y sombra de contacto

  function drawBall3(g, c, b) {

    "#f2d65c": ["#f2d65c", "#d8a21c", "#8a6a14"], "#b98ee8": ["#8e68c4", "#8e68c4", "#4a2f6e"],
    "#d8232a": ["#ff5a4a", "#d8232a", "#8e1418"], "#1f3470": ["#3a5aa8", "#1f3470", "#101c40"],
    "#1f4eb8": ["#4a7ae0", "#1f4eb8", "#12307a"], "#f2c81c": ["#fff27a", "#f2c81c", "#a8860c"],

  function drawPlayer3(g, c, B, labels) {
