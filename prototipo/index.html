    const s = mid.s, px = m => Math.max(1, Math.round(m * s));
    const fog = clamp((mid.d - 150) / 700, 0, 0.5);
    const K = KIT[e.t], shirt = e.gk ? K.gk : K.shirt, shorts = e.gk ? KC.black : K.shorts, socks = e.gk ? K.gk : K.socks;
    // luz principal: la torre más cercana
    const T = TOWERS.reduce((a, b) => Math.hypot(b[0] - p.x, b[1] - p.y) < Math.hypot(a[0] - p.x, a[1] - p.y) ? b : a);
    const lx = T[0] - p.x, ly = T[1] - p.y, litL = (v.x * lx + v.y * ly) > 0; // ¿el lado izquierdo (L) mira a la luz?
    const col = (h, lit) => RAMPS[h] ? RAMPS[h][lit === undefined ? 1 : lit ? 0 : 2] : tone(h, 1, fog);
    const side = k => k.endsWith("L") ? litL : !litL;

    // formas: [tipo, puntos, grosor, color base, lado]
    const shapes = [];
    const limb = (a, b, w, h) => shapes.push(["l", [a, b], w, h, side(a)]);
    const quad = (ks, h, lit) => shapes.push(["p", ks, 0, h, lit]);
    // piernas y brazos del lado en sombra primero, luego tronco, luego el lado iluminado
    const legs = sd => { limb("hip" + sd, "knee" + sd, px(0.72), SKIN); limb("knee" + sd, "foot" + sd, px(0.58), socks); };
    const arm = sd => { limb("sh" + sd, "elb" + sd, px(0.6), shirt); limb("elb" + sd, "hand" + sd, px(0.46), SKIN); };
    const far = litL ? "R" : "L", near = litL ? "L" : "R";
    legs(far); arm(far);
    quad(["shortL", "shortR", "waistR", "waistL"], shorts);
    quad(["waistL", "waistR", "shR", "shL"], shirt);
    quad(litL ? ["waist", "waistR", "shR", "chest"] : ["waist", "waistL", "shL", "chest"], shirt, false); // mitad en sombra
    legs(near); arm(near);

    const paint = (mono, dx, dy) => {
      for (const [type, ks, w, h, lit] of shapes) {
        const q = ks.map(k => Q[k]);
        if (q.some(x => !x)) continue;
        const fill = mono || col(h, lit);
        if (type === "l") pxLine(g, q[0].x + dx, q[0].y + dy, q[1].x + dx, q[1].y + dy, w, fill);
        else pxPoly(g, q.map(o => [o.x + dx, o.y + dy]), fill);
      }
      for (const f of ["footL", "footR"]) if (Q[f]) {
        const w = px(0.95);
        g.fillStyle = mono || BOOT; g.fillRect(Math.round(Q[f].x) - (w >> 1) + dx, Math.round(Q[f].y) - 1 + dy, w + 1, Math.max(2, px(0.45)));
      }
      if (Q.head) pxDisc(g, Q.head.x + dx, Q.head.y + dy, Math.max(0, Math.round(0.62 * s)), mono || col(SKIN, true));
    };
    // contorno oscuro de 1 píxel, como los sprites de la época
    const OUT = "#0b0e12";
    // a lo lejos el sprite es tan pequeño que el contorno lo taparía todo
    if (s >= 1.1) for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) paint(OUT, dx, dy);
    paint(null, 0, 0);
    // dibujo de la camiseta: rayas, aros, franja o banda
    if (!e.gk && K.pattern && s >= 1 && Q.waistL && Q.waistR && Q.shL && Q.shR) {
      const m = (a, b, k) => ({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k });
      const sc = col(K.second), w = Math.max(1, Math.round(0.3 * s));
      const L = (a, b, ww = w) => pxLine(g, a.x, a.y, b.x, b.y, ww, sc);
      if (K.pattern === "stripes") for (const k of [0.25, 0.75]) L(m(Q.waistL, Q.waistR, k), m(Q.shL, Q.shR, k));
      else if (K.pattern === "hoops") for (const k of [0.3, 0.68]) L(m(Q.waistL, Q.shL, k), m(Q.waistR, Q.shR, k));
      else if (K.pattern === "vband") L(m(Q.waistL, Q.waistR, 0.5), m(Q.shL, Q.shR, 0.5), Math.max(1, Math.round(0.55 * s)));
      else if (K.pattern === "hband") L(m(Q.waistL, Q.shL, 0.55), m(Q.waistR, Q.shR, 0.55), Math.max(1, Math.round(0.55 * s)));
      else if (K.pattern === "sash") L(Q.waistR, Q.shL, Math.max(1, Math.round(0.45 * s)));
    }
    // brillo en el borde iluminado del torso
    if (s > 1.2 && Q.shL && Q.waistL && Q.shR && Q.waistR) {
      const [a, b] = litL ? [Q.shL, Q.waistL] : [Q.shR, Q.waistR];
      pxLine(g, a.x, a.y, b.x, b.y, 1, col(shirt, true));
    }
    if (B.studs) {
      const a = proj(c, B.studs[0]), b = proj(c, B.studs[1]);
      if (a && b) pxLine(g, a.x, a.y, b.x, b.y, Math.max(1, px(0.2)), "#f4f4ee");
    }
    // cabeza: pelo, cara en sombra y nuca si está de espaldas
    if (Q.head) {
      const r = Math.max(0, Math.round(0.62 * s)), hx = Math.round(Q.head.x), hy = Math.round(Q.head.y);
      const away = u.x * c.fw[0] + u.y * c.fw[1] > 0.3;
      g.fillStyle = col(HAIR, true);
      if (away) pxDisc(g, hx, hy, r, col(HAIR, true));
      else if (r >= 1) g.fillRect(hx - r, hy - r, 2 * r + 1, Math.max(1, Math.ceil(r * 0.8)));
      if (r >= 2) {
        const sx = (proj(c, [p.x + v.x, p.y + v.y, 9.4]) || Q.head).x > Q.head.x ? 1 : -1; // hacia dónde queda el lado L en pantalla
        const darkSide = litL ? -sx : sx;
        g.fillStyle = col(away ? HAIR : SKIN, false);
        g.fillRect(darkSide > 0 ? hx + 1 : hx - r, hy - r + 1, r, 2 * r - 1);
        if (!away && r >= 3) { g.fillStyle = "#0b0e12"; g.fillRect(hx - 1, hy, 1, 1); g.fillRect(hx + 1, hy, 1, 1); }
      }
      if (labels) pxNumber(g, dorsal(e), Q.head.x, Q.head.y - r - 9, ["B", "K"].includes(FAM[shirt]) ? "#f4f4ee" : col(shirt, true));
    }
  }

  document.addEventListener("keydown", e => {
    if (e.code !== "Space" || state.screen !== "match" || /INPUT|BUTTON|SELECT/.test(document.activeElement?.tagName || "")) return;
    e.preventDefault();
    if (state.cur.phase === "playing" || state.cur.phase === "deliberate") whistle();
    else if (state.cur.phase === "intro") playClip();
  });

  // ---------- Arranque (conserva la partida si la página se actualiza) ----------
  window.claude?.hot?.snapshot?.(() => ({ state }));
  const start = data => { state = useMatch(data && data.state && data.state.ref ? data.state : fresh()); render(); };
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
